<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角的教室・學生</title>
<style>
/* 版面：上方工具列＋左側工具＋中間大舞台（習作原頁或練習題）；老師端多一個 7 格監看牆 */
:root{
  --bg:#e9eef2; --paper:#ffffff; --ink:#1c2a38; --muted:#5d6b78; --line:#cdd8e0; --stage:#dde5eb;
  --accent:#2a6fb0; --green:#1d9a52; --red:#d3392a; --amber:#c98a00;
  --f:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:16px;overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.25}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:auto minmax(0,1fr);flex:1;min-height:0}
.ws-tools{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;width:124px}
.ws-tools .btn{width:100%;padding:8px 4px;font-size:15px}
.ws-tools .sep{height:1px;background:var(--line);margin:4px 0;flex:none}
.ws-tools .cap{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.05em}
.sw{display:flex;gap:6px;justify-content:center}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.row2{display:flex;gap:6px}
.row2 .btn{flex:1}
.ws-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ws-stagewrap{position:relative;flex:1;min-height:0;background:var(--stage)}
.ws-stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.ws-hint{transition:opacity .6s;position:absolute;left:10px;bottom:10px;background:rgba(28,42,56,.86);color:#fff;padding:6px 12px;border-radius:8px;font-size:15px;pointer-events:none;max-width:calc(100% - 20px)}
.ws-ans{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line)}
.ws-ans:empty{display:none}
.ans-status{font-size:18px;margin-right:auto;font-variant-numeric:tabular-nums}
.ans-btn{font-size:21px;padding:9px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--paper)}
.ans-btn .sym{font-weight:700;margin-left:4px}
.ans-btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.ans-btn.no{background:var(--red);border-color:var(--red);color:#fff}
.ans-btn.right{box-shadow:0 0 0 4px var(--green)}
.next-btn{font-size:21px;padding:9px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:#fff}

/* ---------- svg ---------- */
.s-paper{fill:#fff}
.s-out{fill:#dde5eb}
.s-grid50{fill:url(#grid50)}.s-gridlines{fill:url(#gridl50);pointer-events:none}.s-dots{fill:#fff}.s-dotsover{fill:url(#dot50);pointer-events:none}
.sh-fill{stroke:none}.shf0{fill:#bfe0f5}.shf1{fill:#f7d59a}.shf2{fill:#d9efc8}
.sh-edge{fill:none;stroke:#1c2a38;stroke-width:3;stroke-linecap:round;pointer-events:none}.she2{stroke:#2f8f3a}
.sh-lbl{font-size:34px;font-weight:700;fill:#1c2a38;text-anchor:middle}
.paint{fill:#ffb347;fill-opacity:.55;pointer-events:none}
.paint-n{fill:#7a3d00;font-weight:700;text-anchor:middle;pointer-events:none}
.tile{fill:#fbfbf8;stroke:#8d99a4;stroke-width:2;cursor:move}
.a-sel.tile,.a-sel .sheet-o,.a-sel .piece-b{stroke:#1565a0;stroke-width:4}
.sheet-b{fill:#cfe6fa;fill-opacity:.28;cursor:move}
.sheet-l{stroke:#3d8fd1;stroke-width:1.5;fill:none;pointer-events:none}
.sheet-o{fill:none;stroke:#2373b8;stroke-width:3;pointer-events:none}
.sheet-t{fill:#2373b8;font-size:20px;pointer-events:none}
.s-knob{fill:#2373b8;cursor:grab}
.piece-b{fill:var(--pc);fill-opacity:.7;stroke:#1c2a38;stroke-width:2.5;cursor:move;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.25))}
.p-knob{fill:#1c2a38;fill-opacity:.75;cursor:grab}
.hole{fill:#fff;stroke:#8d99a4;stroke-width:2;stroke-dasharray:7 5}
.hole-g{fill:url(#grid50)}.hole-d{fill:url(#dot50)}.hole-o{fill:none}
.cut-line{fill:none;stroke:#d3392a;stroke-width:3;stroke-dasharray:9 6}.cut-dot{fill:#d3392a}
.ans-n{font-size:24px;font-weight:700;fill:#1c2a38;text-anchor:middle;pointer-events:none}
.ans-h{font-size:22px;font-weight:700;fill:#b5600a;text-anchor:middle;pointer-events:none}
.pair-ok{fill:#1d9a52;fill-opacity:.35;pointer-events:none}
.pair-n{font-size:30px;font-weight:700;fill:#0f5e31;text-anchor:middle;pointer-events:none}
.s-wait{fill:#5d6b78;font-size:44px;text-anchor:middle}
.b-sel .b-body{stroke-width:5;stroke:#1565a0}
.s-grid{fill:url(#gridpat)}
.ink{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.q-side{stroke:#1c2a38;stroke-width:7;stroke-linecap:round;fill:none}
.q-arc{stroke:#2a6fb0;stroke-width:4;fill:none}
.q-vtx{fill:#1c2a38}
.a-fill{fill:#f2a54a;fill-opacity:.38}
.a-lbl{fill:#b5600a;font-size:34px;font-weight:700;text-anchor:middle}
.b-body{fill:#5ab4e6;fill-opacity:.30;stroke:#2386c0;stroke-width:3;cursor:move}
.b-tick{stroke:#2386c0;stroke-width:2;pointer-events:none}
.b-corner{fill:none;stroke:#d3392a;stroke-width:3;pointer-events:none}
.b-pivot{fill:#d3392a;pointer-events:none}
.knob{fill:#2386c0;cursor:grab}
.knob-t{fill:#fff;font-size:30px;text-anchor:middle;font-weight:700;pointer-events:none}
.c-fill{fill:var(--cc);fill-opacity:.15;cursor:move}
.c-hit{stroke:transparent;stroke-width:34;fill:none;cursor:move;stroke-linecap:round}
.c-line{stroke:var(--cc);stroke-width:6;fill:none;stroke-linecap:round;pointer-events:none}
.c-arc{stroke:var(--cc);stroke-width:3;fill:none;pointer-events:none}
.c-vtx{fill:var(--cc);pointer-events:none}
.c-lbl{fill:var(--cc);font-size:32px;font-weight:700;text-anchor:middle;pointer-events:none}
.c-knob{fill:var(--cc);cursor:grab}
.bn-ok{fill:#1d9a52}.bn-no{fill:#d3392a}
.bn-t{fill:#fff;font-size:38px;font-weight:700;text-anchor:middle}
.rmark{stroke:#1d9a52;stroke-width:5;fill:none}
.tr-dot{fill:#d3392a}.tr-line{stroke:#d3392a;stroke-width:3;stroke-dasharray:8 6;fill:none}
.done-bg{fill:#fff;fill-opacity:.94}
.done-t{fill:#1c2a38;font-size:56px;font-weight:700;text-anchor:middle}
.done-s{fill:#5d6b78;font-size:30px;text-anchor:middle}

/* ---------- student ---------- */
.bar{display:flex;align-items:center;gap:10px 16px;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
.bar .seat{font-size:22px;font-weight:700}
.bar .ttl{font-size:18px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-left:auto}
.net::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--amber)}
.net.ok::before{background:#3ccf7a}.net.bad::before{background:#ff6b5b}
.light{display:flex;align-items:center;gap:14px;padding:12px 18px;font-size:26px;font-weight:700;color:#fff}
.light.g{background:var(--green)}.light.r{background:var(--red)}
.light .bulb{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.35);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,255,255,.12)}}
@media (prefers-reduced-motion:reduce){.light .bulb{animation:none}}
.overlay{position:fixed;inset:0;background:rgba(28,42,56,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;text-align:center;padding:20px}
.overlay .big{font-size:56px;font-weight:700}
.overlay .small{font-size:22px;opacity:.85}
.overlay .wnet{font-size:24px;margin:0}
.overlay .rejoin{margin-top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.join{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;overflow:auto}
.join-card{background:var(--paper);border-radius:18px;padding:28px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(28,42,56,.12)}
.join-card h1{margin:0;font-size:34px}
.join-card .lbl{font-size:18px;color:var(--muted)}
.seats{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.seats button{font-size:28px;font-weight:700;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.seats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.codein{font-size:40px;letter-spacing:.3em;text-align:center;padding:8px;border:2px solid var(--line);border-radius:12px;width:100%}
.go{font-size:26px;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700}
.go:disabled{opacity:.4}
.taskpick{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- teacher ---------- */
.t-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;background:var(--ink);color:#fff}
.t-head h1{margin:0;font-size:24px}
.code{font-size:18px;display:flex;align-items:center;gap:8px}
.code b{font-size:32px;letter-spacing:.14em;background:#fff;color:var(--ink);padding:0 12px;border-radius:8px;font-variant-numeric:tabular-nums}
.t-head .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:6px 10px;font-size:15px}
.t-head .btn.on{background:#fff;color:var(--ink)}
.t-tasks{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);align-items:center}
.t-tasks .lead{font-weight:700;margin-right:4px}
.task-btn{text-align:left;padding:6px 12px}
.task-btn small{display:block;font-size:12px;color:var(--muted)}
.task-btn.on small{color:#cfd9e1}
.t-main{flex:1;min-height:0;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;padding:10px 16px;overflow:auto;flex:1;align-content:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:4px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tile.lg-g{border-color:var(--green)}.tile.lg-r{border-color:var(--red)}
.tile header{display:flex;align-items:center;gap:8px;padding:6px 10px}
.tile .seatno{font-size:22px}
.tile .nm{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);font-size:17px;padding:2px 4px;background:transparent}
.dot{width:12px;height:12px;border-radius:50%;background:#b8c3cc;flex:none}
.dot.on{background:#2fbf6a}
.tile-stage{position:relative;height:clamp(170px,calc(50vh - 215px),440px);background:var(--stage);cursor:zoom-in}
.tile-stage svg{width:100%;height:100%;display:block}
.tile-stage .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;background:rgba(221,229,235,.8)}
.tile-sum{padding:6px 10px 0;font-size:15px;min-height:24px}
.tile-sum .warn{color:var(--red);font-weight:700}
.tile-sum .good{color:var(--green);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px;padding:4px 10px 0;min-height:14px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}
.dots i.na{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
.dots i.na.ok{color:var(--green)}.dots i.na.no{color:var(--red)}
.tile footer{display:flex;gap:6px;padding:8px 10px}
.lg{flex:1;border-radius:9px;border:2px solid;padding:6px 4px;font-size:14px;font-weight:700;background:var(--paper)}
.lg.gbtn{border-color:var(--green);color:var(--green)}
.lg.rbtn{border-color:var(--red);color:var(--red)}
.lg.gbtn.on{background:var(--green);color:#fff}
.lg.rbtn.on{background:var(--red);color:#fff}
.lg.cbtn{flex:.6;border-color:var(--line);color:var(--muted)}
.legend{padding:0 16px 10px;font-size:14px;color:var(--muted)}
.demo{flex:1;min-height:0;display:flex;flex-direction:column}
.qrwrap{position:fixed;inset:0;background:rgba(28,42,56,.8);z-index:45;display:flex;align-items:center;justify-content:center;padding:16px}
.qrcard{background:var(--paper);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:640px;width:100%;max-height:100%;overflow:auto}
.qrimg img{width:min(420px,70vh);height:auto;image-rendering:pixelated;display:block}
.qrnone{padding:40px 10px;color:var(--red);font-size:18px;text-align:center}
.qrbig{font-size:30px}.qrbig b{font-size:46px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.qrhelp{font-size:18px;color:var(--muted);text-align:center}
.qrurl{font-size:15px;word-break:break-all;color:var(--accent)}
.qrcard details{width:100%;font-size:15px}.qrcard details input{width:100%;margin:6px 0;padding:6px 8px;border:2px solid var(--line);border-radius:8px}
.units{display:inline-flex;gap:4px;margin-right:8px;padding-right:10px;border-right:2px solid var(--line)}
.unit-btn{padding:6px 10px;font-weight:700}
.ws-count{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.95);border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-size:22px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.num-disp{min-width:150px;font-size:30px;font-weight:700;padding:4px 14px;border:2px solid var(--line);border-radius:12px;text-align:center;font-variant-numeric:tabular-nums}
.num-disp small{font-size:16px;font-weight:400}
.num-disp .ph{color:var(--line)}
.num-disp.ok{border-color:var(--green);color:var(--green)}.num-disp.no{border-color:var(--red);color:var(--red)}
.pad{display:flex;flex-wrap:wrap;gap:4px}
.pad-btn{width:44px;height:44px;font-size:22px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.pad-btn:disabled,.ok-btn:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(28,42,56,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--paper);border-radius:14px;width:min(1400px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-card header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-card header b{font-size:24px}
.modal-card .msum{font-size:17px;margin-right:auto}
.modal-stage{flex:1;min-height:0;background:var(--stage)}
.modal-stage svg{width:100%;height:100%;display:block}
.modal-card .lg{flex:none;padding:8px 14px;font-size:16px}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="grid50" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#ffffff"/><path d="M60 0H0V60" fill="none" stroke="#cdd8e0" stroke-width="1.5"/></pattern>
    <pattern id="gridl50" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#9fb0bd" stroke-width="1.2"/></pattern>
    <pattern id="dot50" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="4" fill="#6b7a86"/><circle cx="60" cy="0" r="4" fill="#6b7a86"/><circle cx="0" cy="60" r="4" fill="#6b7a86"/><circle cx="60" cy="60" r="4" fill="#6b7a86"/></pattern>
    <pattern id="gridpat" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff"/>
      <path d="M40 0H0V40" fill="none" stroke="#e3eaf0" stroke-width="2"/>
    </pattern>
  </defs>
</svg>

  var xs=[],ys=[];function add(p){xs.push(p[0]);ys.push(p[1]);}
  (st.ink||[]).forEach(function(k){for(var i=0;k.p&&i<k.p.length;i+=2)add([k.p[i],k.p[i+1]]);});
  (st.copies||[]).forEach(function(c){var t={x:c.x,y:c.y,r:c.r};add([c.x,c.y]);add(toW(t,c.a));add(toW(t,c.b));});
  if(!xs.length)return null;return [Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)];
}
function curQ(st){return st.q||(st.qs&&st.qs[st.i]);}
function bLen(st,b){return (b&&b.L)||(st.k==='wb'?260:300);}
function wire(st){
  if(st.k==='wb'){var w0={k:'wb',id:st.id,ink:st.ink,copies:st.copies,boards:st.boards};if(st.tiles){w0.tiles=st.tiles;w0.sheets=st.sheets;w0.pieces=st.pieces;w0.paint=st.paint;}return w0;}
  var o={k:st.k,id:st.id,i:st.i,n:st.qs.length,q:st.qs[st.i]||null,ans:st.ans,res:st.res,done:st.done};
  if(st.k==='rao')o.board=st.board;else if(st.k==='cmp')o.B=st.B;else{o.paint=st.paint;o.pieces=st.pieces;}
  return o;
}
/* relay through the PeerJS signalling server: payload must look like an ICE candidate, and stay under ~16 KB */
function relay(p,dst,obj){try{if(p&&p.socket&&!p.disconnected&&!p.destroyed)p.socket.send({type:'CANDIDATE',dst:dst,payload:{candidate:{candidate:'',sdpMid:'0',sdpMLineIndex:0},type:'data',connectionId:'dc_jiao',jiao:obj}});}catch(e){}}
function dropLost(p){try{if(p&&p._lostMessages)p._lostMessages.clear();}catch(e){}}
function fitWire(st){
  var w=wire(st),n=JSON.stringify(w).length;if(n<=11000||w.k!=='wb')return w;
  w=JSON.parse(JSON.stringify(w));
  for(var round=0;round<6&&n>11000;round++){
    w.ink.forEach(function(k){var q=[];for(var i=0;i<k.p.length;i+=2){if(i%4===0||i>=k.p.length-2)q.push(k.p[i],k.p[i+1]);}k.p=q;});
    n=JSON.stringify(w).length;
  }
  while(n>11000&&w.ink.length){w.ink.shift();n=JSON.stringify(w).length;}
  return w;
}
function nQ(st){return st.n||(st.qs?st.qs.length:0);}

/* board geometry */
function bCorners(L){var H=L*T30;return [[0,0],[L,0],[0,-H]];}
function toW(b,l){var c=Math.cos(rad(b.r)),s=Math.sin(rad(b.r));return [b.x+l[0]*c+l[1]*s,b.y-l[0]*s+l[1]*c];}
function toL(b,w){var c=Math.cos(rad(b.r)),s=Math.sin(rad(b.r));var dx=w[0]-b.x,dy=w[1]-b.y;return [dx*c-dy*s,dx*s+dy*c];}
function bPivotW(b,L){return toW(b,bCorners(L)[b.pv||0]);}
function setBoardRot(b,r,pw,L){var pl=bCorners(L)[b.pv||0];b.r=norm(r);var c=Math.cos(rad(b.r)),s=Math.sin(rad(b.r));b.x=pw[0]-(pl[0]*c+pl[1]*s);b.y=pw[1]-(-pl[0]*s+pl[1]*c);}
function copyDirs(c){return [norm(ang([0,0],c.a)+c.r),norm(ang([0,0],c.b)+c.r)];}
function boardAligned(st){var q=curQ(st),b=st.board;if(!q||!b)return false;if(dist([b.x,b.y],q.V)>4)return false;var legs=[b.r,b.r+90],sides=[q.s1,q.s1+q.a];return legs.some(function(l){return sides.some(function(s){return Math.abs(adiff(l,s))<2.5;});});}
function copyAligned(st){var q=curQ(st),c=st.B;if(!q||!c)return {v:false,s:false};var v=dist([c.x,c.y],q.A.V)<4;var d=copyDirs(c),sides=[q.A.s1,q.A.s1+q.A.a];var s=d.some(function(x){return sides.some(function(y){return Math.abs(adiff(x,y))<2.5;});});return {v:v,s:s};}

/* ================= Scene ================= */
function Scene(svg,opt){
  this.svg=svg;this.opt=opt||{};this.ia=!!this.opt.interactive;this.mode='move';this.cut=[];this.penColor='#d3392a';this.tr=[];this.anim=null;this.st=null;
  svg.setAttribute('preserveAspectRatio','xMidYMid meet');
  this.gBg=el('g',null,svg);this.gInk=el('g',null,svg);this.gDyn=el('g',null,svg);
  if(this.ia)this.bind();
}
Scene.prototype.dims=function(){return this.st.k==='wb'?[WB_W,WB_H]:[PR_W,PR_H];};
Scene.prototype.load=function(st){if(this.anim){this.anim.cancel();this.anim=null;}this.st=st;this.tr=[];this.cut=[];this.drawBg();this.drawInk();this.drawDyn();this.view();};
Scene.prototype.view=function(){
  var d=this.dims(),X0=0,Y0=0,W=d[0],H=d[1];
  if(this.st.k==='wb'){var bx=TASK[this.st.id].box;X0=bx[0];Y0=bx[1];W=bx[2];H=bx[3];}
  var x=X0,y=Y0,w=W,hh=H,z=(this.ia&&this.st.zoom)?this.st.zoom:null;
  if(z&&z.z>1){w=W/z.z;hh=H/z.z;x=clamp(z.cx-w/2,X0,X0+W-w);y=clamp(z.cy-hh/2,Y0,Y0+H-hh);z.cx=x+w/2;z.cy=y+hh/2;}

  this.svg.setAttribute('viewBox',[x,y,w,hh].map(f).join(' '));
};
Scene.prototype.drawBg=function(){
  var g=this.gBg,st=this.st;clear(g);var d=this.dims();
  if(st.k==='wb'){
    var t=TASK[st.id],bx=t.box;
    el('rect',{x:-3000,y:-3000,width:WB_W+6000,height:WB_H+6000,class:'s-out'},g);
    el('rect',{x:bx[0],y:bx[1],width:bx[2],height:bx[3],class:'s-paper'},g);
    var cid='clip'+(++CLIPN);var cp=el('clipPath',{id:cid},g);el('rect',{x:bx[0],y:bx[1],width:bx[2],height:bx[3]},cp);
    if(PAGE_URL[t.page]){var im=el('image',{x:0,y:0,width:WB_W,height:WB_H,'clip-path':'url(#'+cid+')'},g);im.setAttribute('href',PAGE_URL[t.page]);}
    else{var wt=el('text',{x:bx[0]+bx[2]/2,y:bx[1]+bx[3]/2,class:'s-wait'},g);wt.textContent='習作頁面下載中…（要先連上老師）';if(window.needPage)window.needPage(t.page);}
    return;
  }
  if(AREA_KINDS[st.k]){this.drawAreaBg(g);return;}
  el('rect',{x:0,y:0,width:d[0],height:d[1],class:'s-grid'},g);
  if(st.done)return;
  var q=curQ(st);if(!q)return;
  if(st.k==='rao'){
    el('path',{d:'M'+pt(P(q.V,q.s1,q.l1))+' L'+pt(q.V)+' L'+pt(P(q.V,q.s1+q.a,q.l2)),class:'q-side'},g);
    el('path',{d:arcD(q.V,34,q.s1,q.a),class:'q-arc'},g);
    el('circle',{cx:q.V[0],cy:q.V[1],r:8,class:'q-vtx'},g);
  }else{
    var A=q.A;
    el('path',{d:sectorD(A.V,A.rs,A.s1,A.a),class:'a-fill'},g);
    el('path',{d:'M'+pt(P(A.V,A.s1,A.l1))+' L'+pt(A.V)+' L'+pt(P(A.V,A.s1+A.a,A.l2)),class:'q-side'},g);
    el('circle',{cx:A.V[0],cy:A.V[1],r:8,class:'q-vtx'},g);
    var lp=P(A.V,A.s1+A.a/2+180,40);var tx=el('text',{x:f(lp[0]),y:f(lp[1]+12),class:'a-lbl'},g);tx.textContent='甲';
  }
};
function inkD(p){var s='M'+p[0]+' '+p[1];if(p.length===2)return s+' l0.1 0';for(var i=2;i<p.length;i+=2)s+=' L'+p[i]+' '+p[i+1];return s;}
Scene.prototype.drawInk=function(){var g=this.gInk;clear(g);if(this.st.k!=='wb')return;(this.st.ink||[]).forEach(function(k){if(k&&k.p&&k.p.length>=2)el('path',{d:inkD(k.p),class:'ink',stroke:/^#[0-9a-f]{6}$/i.test(k.c)?k.c:'#d3392a'},g);});};
Scene.prototype.drawBoard=function(g,b,L,idx,sel){
  var H=L*T30,ia=this.ia;idx=idx||0;
  var gg=el('g',{transform:'translate('+f(b.x)+','+f(b.y)+') rotate('+f(-b.r)+')','data-h':'board:'+idx,class:sel?'b-sel':''},g);
  var c=[L/3,-H/3];var inn=[[0,0],[L,0],[0,-H]].map(function(p){return [c[0]+.42*(p[0]-c[0]),c[1]+.42*(p[1]-c[1])];});
  el('path',{d:'M0,0 L'+L+',0 L0,'+f(-H)+' Z M'+inn.map(pt).join(' L')+' Z','fill-rule':'evenodd',class:'b-body'},gg);
  var td='';for(var x=10;x<L*.85;x+=10)td+='M'+x+' 0V'+(x%50===0?-16:-8);
  el('path',{d:td,class:'b-tick'},gg);
  el('path',{d:'M0,-26 H26 V0',class:'b-corner'},gg);
  if(ia){
    var pv=bCorners(L)[b.pv||0];el('circle',{cx:f(pv[0]),cy:f(pv[1]),r:9,class:'b-pivot'},gg);
    var hyp=Math.hypot(L,H),n=[H/hyp,-L/hyp],m=[L/2,-H/2],k=[m[0]+n[0]*46,m[1]+n[1]*46];
    var kg=el('g',{'data-h':'knob:'+idx},gg);el('circle',{cx:f(k[0]),cy:f(k[1]),r:26,class:'knob'},kg);
    var t=el('text',{x:f(k[0]),y:f(k[1]+10),class:'knob-t',transform:'rotate('+f(b.r)+' '+f(k[0])+' '+f(k[1])+')'},kg);t.textContent='↻';
  }
};
Scene.prototype.drawCopy=function(g,c,idx,label){
  var col=COPYCOL[(c.c||0)%3];
  var gg=el('g',{transform:'translate('+f(c.x)+','+f(c.y)+') rotate('+f(-c.r)+')','data-h':'copy:'+idx,style:'--cc:'+col},g);
  var aa=ang([0,0],c.a),ab=ang([0,0],c.b),s0=aa,sp=norm(ab-aa);if(sp>180){s0=ab;sp=360-sp;}
  var la=Math.hypot(c.a[0],c.a[1]),lb=Math.hypot(c.b[0],c.b[1]);var R=c.rs||Math.min(la,lb);
  el('path',{d:sectorD([0,0],R,s0,sp),class:'c-fill'},gg);
  var dd='M'+pt(c.a)+' L0,0 L'+pt(c.b);
  el('path',{d:dd,class:'c-hit'},gg);el('path',{d:dd,class:'c-line'},gg);
  el('path',{d:arcD([0,0],30,s0,sp),class:'c-arc'},gg);
  el('circle',{cx:0,cy:0,r:8,class:'c-vtx'},gg);
  var lp=P([0,0],s0+sp/2+180,40);var t=el('text',{x:f(lp[0]),y:f(lp[1]+11),class:'c-lbl',transform:'rotate('+f(c.r)+' '+f(lp[0])+' '+f(lp[1])+')'},gg);t.textContent=label;
  if(this.ia){var u=[c.a[0]/la,c.a[1]/la],kp=[c.a[0]+u[0]*34,c.a[1]+u[1]*34];var kg=el('g',{'data-h':'cknob:'+idx},gg);el('circle',{cx:f(kp[0]),cy:f(kp[1]),r:24,class:'c-knob'},kg);var kt=el('text',{x:f(kp[0]),y:f(kp[1]+10),class:'knob-t',transform:'rotate('+f(c.r)+' '+f(kp[0])+' '+f(kp[1])+')'},kg);kt.textContent='↻';}
};
Scene.prototype.banner=function(g,text,ok){var W=this.dims()[0];var gg=el('g',null,g);el('rect',{x:W/2-360,y:14,width:720,height:72,rx:16,class:ok?'bn-ok':'bn-no'},gg);var t=el('text',{x:W/2,y:64,class:'bn-t'},gg);t.textContent=text;};
Scene.prototype.drawDyn=function(){
  var g=this.gDyn,st=this.st,self=this;clear(g);
  if(isAreaSt(st)&&!st.done){this.drawAreaDyn(g);if(st.k!=='wb')return;}
  if(st.k==='wb'){
    (st.copies||[]).forEach(function(c,i){self.drawCopy(g,c,i,['甲','乙','丙'][i]||'');});
    (st.boards||[]).forEach(function(b,i){self.drawBoard(g,b,bLen(st,b),i,self.ia&&i===st.sel&&st.boards.length>1);});
    if(this.ia&&this.tr.length){
      var v=this.tr[0];this.tr.forEach(function(p,i){if(i>0)el('line',{x1:f(v[0]),y1:f(v[1]),x2:f(p[0]),y2:f(p[1]),class:'tr-line'},g);el('circle',{cx:f(p[0]),cy:f(p[1]),r:i?8:11,class:'tr-dot'},g);});
    }
    return;
  }
  if(st.done){var d=this.dims();el('rect',{x:0,y:0,width:d[0],height:d[1],class:'done-bg'},g);var ok=(st.res||[]).filter(function(r){return r.ok;}).length;var t1=el('text',{x:d[0]/2,y:360,class:'done-t'},g);t1.textContent='練習完成！';var t2=el('text',{x:d[0]/2,y:430,class:'done-s'},g);t2.textContent='答對 '+ok+' / '+(st.res||[]).length+' 題';return;}
  var q=curQ(st);if(!q)return;
  if(st.k==='rao'){
    if(st.ans&&q.t==='r')el('path',{d:rightD(q.V,q.s1,32),class:'rmark'},g);
    if(st.board&&st.board.on)this.drawBoard(g,st.board,bLen(st,st.board),0,false);
    if(st.ans){var okr=st.ans===q.t;this.banner(g,okr?('✓ 答對了！這是'+TNAME[q.t]+' '+TSYM[q.t]):('✗ 再看一次：這是'+TNAME[q.t]+' '+TSYM[q.t]),okr);}
  }else{
    if(st.B)this.drawCopy(g,st.B,0,'乙');
    if(st.ans){var okc=st.ans===q.k;var rel=q.k==='gt'?'∠甲 ＞ ∠乙':q.k==='lt'?'∠甲 ＜ ∠乙':'∠甲 ＝ ∠乙';this.banner(g,(okc?'✓ 答對了！':'✗ 再看一次：')+rel,okc);}
  }
};
/* ---- interaction ---- */
Scene.prototype.board=function(i){var st=this.st;if(st.k==='wb'){if(i==null)i=st.sel;return st.boards[i]||null;}return st.board;};
Scene.prototype.copyAt=function(i){return this.st.k==='cmp'?this.st.B:this.st.copies[i];};
Scene.prototype.targets=function(ex){
  var st=this.st,pts=[],dirs=[];
  if(st.k==='rao'){var q=curQ(st);if(q){pts.push(q.V);dirs.push(q.s1,norm(q.s1+q.a));}}
  else if(st.k==='cmp'){var q2=curQ(st);if(q2){pts.push(q2.A.V);dirs.push(q2.A.s1,norm(q2.A.s1+q2.A.a));}}
  else (st.copies||[]).forEach(function(c,i){pts.push(c.o);dirs.push(ang([0,0],c.a),ang([0,0],c.b));if(i!==ex){pts.push([c.x,c.y]);dirs=dirs.concat(copyDirs(c));}});
  return {pts:pts,dirs:dirs};
};
Scene.prototype.snapPos=function(o,ex,th){var T=this.targets(ex).pts;for(var i=0;i<T.length;i++){if(dist([o.x,o.y],T[i])<th){o.x=T[i][0];o.y=T[i][1];return true;}}return false;};
Scene.prototype.snapBoardRot=function(r){if(this.st.k==='wb')return r;var D=this.targets(-1).dirs;var best=null;[r,r+90].forEach(function(l){D.forEach(function(t){var d=adiff(t,l);if(Math.abs(d)<7&&(best===null||Math.abs(d)<Math.abs(best)))best=d;});});return best===null?r:r+best;};
Scene.prototype.snapCopyRot=function(c,idx,r){var D=this.targets(idx).dirs;var la=ang([0,0],c.a),lb=ang([0,0],c.b);var best=null;[la+r,lb+r].forEach(function(l){D.forEach(function(t){var d=adiff(t,l);if(Math.abs(d)<7&&(best===null||Math.abs(d)<Math.abs(best)))best=d;});});return norm(best===null?r:r+best);};
Scene.prototype.changed=function(final){if(this.opt.onChange)this.opt.onChange(final);};
Scene.prototype.bind=function(){
  var s=this,svg=this.svg,drag=null;
  svg.addEventListener('pointerdown',function(e){
    if(!s.st||s.locked)return;
    var p=svgPt(svg,e),hn=e.target.closest?e.target.closest('[data-h]'):null,hv=hn?hn.getAttribute('data-h'):'';
    if(s.anim){s.anim.cancel();s.anim=null;}
    var st=s.st;
    if(isAreaSt(st)){var ad=s.areaDown(p,hv);if(ad){drag=ad;try{svg.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();s.drawDyn();s.changed(false);return;}}
    if(st.k==='wb'&&s.mode==='pen'){var k={c:s.penColor,p:[Math.round(p[0]),Math.round(p[1])]};var path=el('path',{class:'ink',stroke:k.c,d:inkD(k.p)},s.gInk);drag={t:'pen',k:k,path:path,last:p};}
    else if(st.k==='wb'&&s.mode==='trace'){s.tr.push([Math.round(p[0]),Math.round(p[1])]);if(s.tr.length===3)s.addCopy();s.drawDyn();if(s.opt.onMode)s.opt.onMode();s.changed(true);return;}
    else if(hv.indexOf('board:')===0){var bi=+hv.slice(6),b=s.board(bi);if(st.k==='wb'){st.sel=bi;}drag={t:'board',b:b,off:[b.x-p[0],b.y-p[1]],p0:p,moved:false};}
    else if(hv.indexOf('knob:')===0){var bi2=+hv.slice(5),b2=s.board(bi2);if(st.k==='wb')st.sel=bi2;var pw=bPivotW(b2,bLen(st,b2));drag={t:'rot',b:b2,pw:pw,a0:ang(pw,p),r0:b2.r};}
    else if(hv.indexOf('copy:')===0){var i=+hv.slice(5),c=s.copyAt(i);if(c&&!(st.k==='cmp'&&st.ans))drag={t:'copy',i:i,c:c,off:[c.x-p[0],c.y-p[1]]};}
    else if(hv.indexOf('cknob:')===0){var i2=+hv.slice(6),c2=s.copyAt(i2);if(c2&&!(st.k==='cmp'&&st.ans))drag={t:'crot',i:i2,c:c2,a0:ang([c2.x,c2.y],p),r0:c2.r};}
    else if(st.k==='wb'&&st.zoom&&st.zoom.z>1){drag={t:'pan',p0:[e.clientX,e.clientY],c0:[st.zoom.cx,st.zoom.cy]};}
    if(drag){try{svg.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return;var p=svgPt(svg,e),st=s.st;
    if(drag.t==='x'){if(drag.move){drag.move(p);s.drawDyn();s.changed(false);}return;}
    if(drag.t==='pen'){if(dist(p,drag.last)>=3&&drag.k.p.length<4000){drag.k.p.push(Math.round(p[0]),Math.round(p[1]));drag.last=p;drag.path.setAttribute('d',inkD(drag.k.p));}return;}
    if(drag.t==='board'){var b=drag.b;if(dist(p,drag.p0)>5)drag.moved=true;if(!drag.moved)return;b.x=p[0]+drag.off[0];b.y=p[1]+drag.off[1];if(st.k!=='wb')s.snapPos(b,-1,28);}
    else if(drag.t==='rot'){var b2=drag.b;var r=drag.r0+adiff(ang(drag.pw,p),drag.a0);setBoardRot(b2,s.snapBoardRot(r),drag.pw,bLen(st,b2));drag.a0=ang(drag.pw,p);drag.r0=b2.r;}
    else if(drag.t==='copy'){drag.c.x=p[0]+drag.off[0];drag.c.y=p[1]+drag.off[1];s.snapPos(drag.c,drag.i,26);}
    else if(drag.t==='crot'){var v=[drag.c.x,drag.c.y];var r2=drag.r0+adiff(ang(v,p),drag.a0);drag.a0=ang(v,p);drag.r0=norm(r2);drag.c.r=s.snapCopyRot(drag.c,drag.i,drag.r0);}
    else if(drag.t==='pan'){var m=svg.getScreenCTM();var z=st.zoom;z.cx=drag.c0[0]-(e.clientX-drag.p0[0])/m.a;z.cy=drag.c0[1]-(e.clientY-drag.p0[1])/m.d;s.view();return;}
    s.drawDyn();s.changed(false);
  });
  function up(e){
    if(!drag)return;var d=drag;drag=null;
    if(d.t==='x'){if(d.up)d.up(svgPt(svg,e));s.drawDyn();s.changed(true);return;}
    if(d.t==='pen'){if(d.k.p.length>=2)s.st.ink.push(d.k);s.drawInk();}
    if(d.t==='board'&&!d.moved)s.pickPivot(d.b,svgPt(svg,e));
    if(d.t==='rot'||d.t==='crot'){/* keep snapped value */}
    if(d.t==='copy'||d.t==='crot'||d.t==='board'||d.t==='rot'){var o=d.c||d.b;o.x=Math.round(o.x*10)/10;o.y=Math.round(o.y*10)/10;}
    s.drawDyn();s.changed(true);
  }
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);

};

function unitOf(st){return st.k==='wb'?U_WB:U_PR;}
function latAt(st,p){
  if(AREA_KINDS[st.k])return {ox:0,oy:0,s:U_PR};

  for(var i=0;i<t.lat.length;i++){var L=t.lat[i];if(!p||(p[1]>=L.y0&&p[1]<L.y1))return {ox:L.ox,oy:L.oy,s:U_WB};}

function cellOf(L,p){return [Math.floor((p[0]-L.ox)/L.s),Math.floor((p[1]-L.oy)/L.s)];}

function polyD(ps){return 'M'+ps.map(pt).join(' L')+' Z';}

/* ---- random shapes on the grid ---- */
function genShape(n,maxW,maxH,spread,t){
  function key(c){return c[0]+','+c[1];}
  function bb(list){var xs=list.map(function(c){return c[0];}),ys=list.map(function(c){return c[1];});return [Math.min.apply(0,xs),Math.min.apply(0,ys),Math.max.apply(0,xs),Math.max.apply(0,ys)];}
  var cells=[[0,0]],set={'0,0':1},guard=0;
  while(cells.length<n&&guard++<600){
    var cand=[];
    cells.forEach(function(c){DIR4.forEach(function(d){var q=[c[0]+d[0],c[1]+d[1]];if(set[key(q)])return;var b=bb(cells.concat([q]));if(b[2]-b[0]+1>maxW||b[3]-b[1]+1>maxH)return;var nb=DIR4.filter(function(e){return set[(q[0]+e[0])+','+(q[1]+e[1])];}).length;cand.push({q:q,nb:nb});});});
    if(!cand.length)break;
    var nbs=cand.map(function(c){return c.nb;}),pool;
    if(spread){var mn=Math.min.apply(0,nbs);pool=cand.filter(function(c){return c.nb===mn;});}
    else{var mx=Math.max.apply(0,nbs);pool=Math.random()<.65?cand.filter(function(c){return c.nb===mx;}):cand;}
    var c=pick(pool).q;if(set[key(c)])continue;set[key(c)]=1;cells.push(c);
  }
  var tris=[],used={},cands=[];
  cells.forEach(function(c){DIR4.forEach(function(d){var oc=[c[0]+d[0],c[1]+d[1]];if(set[key(oc)])return;for(var k=0;k<4;k++){if(LEGS[k].some(function(e){return set[(oc[0]+NBR[e][0])+','+(oc[1]+NBR[e][1])];}))cands.push({c:oc,k:k});}});});
  cands=shuffle(cands);
  for(var i=0;i<cands.length&&tris.length<t;i++){
    var cd=cands[i],kk=key(cd.c);if(used[kk])continue;
    var b=bb(cells.concat(tris.map(function(x){return x.c;})).concat([cd.c]));if(b[2]-b[0]+1>maxW+1||b[3]-b[1]+1>maxH+1)continue;
    used[kk]=1;tris.push(cd);
  }
  if(tris.length%2)tris.pop();
  var all=cells.concat(tris.map(function(x){return x.c;})),B=bb(all);
  cells=cells.map(function(c){return [c[0]-B[0],c[1]-B[1]];});
  tris=tris.map(function(x){return {c:[x.c[0]-B[0],x.c[1]-B[1]],k:x.k};});
  return {cells:cells,tris:tris,w:B[2]-B[0]+1,h:B[3]-B[1]+1,area:cells.length+tris.length/2};
}
function centerOff(sh,x0,x1,y0,y1){return [x0+Math.floor((x1-x0-sh.w)/2),y0+Math.floor((y1-y0-sh.h)/2)];}
function genACnt(dot){
  var N=dot?12:15,out=[];
  for(var i=0;i<N;i++){
    var t=dot?pick([2,2,4,4,6]):pick([0,0,0,2,2,4]),n=ri(dot?4:5,dot?10:14);
    var sh=genShape(n,9,7,Math.random()<.3,t);out.push({area:sh.area,sh:sh,off:centerOff(sh,0,20,2,13)});
  }

}
function genACmp(){
  var kinds=shuffle(['gt','gt','gt','gt','lt','lt','lt','lt','eq','eq','eq','eq']);
  return kinds.map(function(k){
    var small=ri(6,13),big=k==='eq'?small:small+ri(1,3);
    var aA=k==='lt'?small:big,aB=k==='lt'?big:small;
    var trap=Math.random()<.75;
    function mk(area,isSmall){var t=(area>7&&Math.random()<.4)?2:0;return genShape(area-t/2,8,10,trap?isSmall:Math.random()<.5,t);}
    var A=mk(aA,aA<aB||(k==='eq'&&Math.random()<.5)),B=mk(aB,aB<aA||(k==='eq'&&!A._s));

    return {k:kk,A:{sh:A,off:centerOff(A,0,10,2,13),area:A.area},B:{sh:B,off:centerOff(B,10,20,2,13),area:B.area}};
  });

function shapeGeom(sh,ox,oy,s){
  var set={},tri={};sh.cells.forEach(function(c){set[c[0]+','+c[1]]=1;});sh.tris.forEach(function(t){tri[t.c[0]+','+t.c[1]]=t.k;});

    if(e==='t')return {a:[X(x),Y(y)],b:[X(x+1),Y(y)],n:[x,y-1],ne:'b'};
    if(e==='b')return {a:[X(x),Y(y+1)],b:[X(x+1),Y(y+1)],n:[x,y+1],ne:'t'};
    if(e==='l')return {a:[X(x),Y(y)],b:[X(x),Y(y+1)],n:[x-1,y],ne:'r'};

  sh.tris.forEach(function(t){var x=t.c[0],y=t.c[1],k=t.k;var C=[[X(x),Y(y)],[X(x+1),Y(y)],[X(x+1),Y(y+1)],[X(x),Y(y+1)]];

}

Workspace.prototype.updateAns=function(){
  var st=this.state();if(!st||st.k==='wb'||!this.nextBtn)return;
  var q=curQ(st),ok=st.res.filter(function(r){return r.ok;}).length,stat=this.ansEl.querySelector('.ans-status');
  if(st.done){stat.textContent='完成！答對 '+ok+' / '+st.res.length;}
  else{var extra='';if(st.k==='rao'&&!st.ans)extra=boardAligned(st)?'　三角板對好了 ✓':'';if(st.k==='cmp'&&!st.ans){var ca=copyAligned(st);extra=(ca.v?'　頂點對齊 ✓':'')+(ca.s?'　邊對齊 ✓':'');}stat.textContent='第 '+(st.i+1)+' / '+st.qs.length+' 題　答對 '+ok+extra;}
  if(this.numDisp&&(st.k==='acnt'||st.k==='adot'||st.k==='apair')){
    var right2=rightOf(st,q),d2=this.numDisp;
    if(st.ans){d2.className='num-disp '+(st.ans===right2?'ok':'no');d2.innerHTML=esc(st.ans)+' <small>平方公分</small>'+(st.ans===right2?'':' <small>（是 '+esc(right2)+'）</small>');}
    else{d2.className='num-disp';d2.innerHTML=(this.entry?esc(this.entry):'<span class="ph">?</span>')+' <small>平方公分</small>';}
    this.ansEl.querySelectorAll('.pad-btn').forEach(function(b){b.disabled=!!st.ans||st.done;});if(this.okBtn)this.okBtn.disabled=!!st.ans||st.done||!this.entry;
    if(st.k==='apair'&&!st.ans){var PI=pairInfo(st);stat.textContent+=PI.n>=PI.need?'　全部拼成整格了 ✓':'';}
  }
  for(var k in this.ansBtns){var b=this.ansBtns[k];b.className='ans-btn';b.disabled=!!st.ans||st.done;if(st.ans&&q){var right=rightOf(st,q);if(k===st.ans)b.classList.add(k===right?'ok':'no');else if(k===right)b.classList.add('right');}}
  this.nextBtn.disabled=!st.ans||st.done;this.nextBtn.hidden=!!st.done;
};

/* ================= summaries (teacher) ================= */
function summary(st){
  if(!st)return '';
  if(st.k==='wb'&&st.tiles){var c=areaCounts(st);return '方瓦 '+c.tiles+'・塗 '+c.paint+' 格・剪 '+c.pieces+' 片・筆 '+((st.ink||[]).length)+' 條';}
  if(st.k==='wb')return '筆跡 '+((st.ink||[]).length)+' 條・描角 '+((st.copies||[]).length)+' 個・三角板 '+((st.boards||[]).length)+' 個';
  var ok=(st.res||[]).filter(function(r){return r.ok;}).length,n=nQ(st);
  if(st.done)return '<span class="good">完成！答對 '+ok+' / '+(st.res||[]).length+'</span>';
  var s='第 '+((st.i||0)+1)+'/'+n+' 題・答對 '+ok+'/'+(st.res||[]).length;
  if(!st.ans){
    if(st.k==='rao')s+=boardAligned(st)?'・<span class="good">三角板對準 ✓</span>':'・三角板還沒對準';
    else if(st.k==='apair'){var PI=pairInfo(st);s+='・拼好 '+PI.n+'/'+PI.need+' 格'+(PI.n>=PI.need?' <span class="good">✓</span>':'');}
    else if(AREA_KINDS[st.k]){var c2=areaCounts(st);s+='・塗 '+c2.paint+' 格・剪 '+c2.pieces+' 片';}
    else{var ca=copyAligned(st);s+='・'+(ca.v?'<span class="good">頂點✓</span>':'頂點未對齊')+'・'+(ca.s?'<span class="good">邊✓</span>':'邊未對齊');}
  }else{var last=st.res[st.res.length-1];s+=last&&last.ok?'・<span class="good">這題對</span>':'・<span class="warn">這題錯</span>';}
  return s;
}
function dotsHTML(st){if(!st||st.k==='wb')return '';return (st.res||[]).map(function(r){return '<i class="'+(r.ok?'ok':'no')+(r.al?'':' na')+'"></i>';}).join('');}

function StudentApp(){
  var root=document.getElementById('root');
  var seat=lsGet('jiao.s.seat',0),code=lsGet('jiao.s.code','');

  var join=h('div',{class:'join'});
  join.innerHTML='<div class="join-card"><h1>角的教室</h1><div class="lbl">1. 點你的座號</div><div class="seats"></div><div class="lbl">2. 輸入老師螢幕上的「班級代碼」</div><input class="codein" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="班級代碼"><button class="go" type="button">進入</button></div>';
  document.body.appendChild(join);

  for(var i=1;i<=7;i++){(function(n){var b=h('button',{type:'button'},String(n));b.addEventListener('click',function(){seat=n;sync();});seatsEl.appendChild(b);})(i);}
  codeIn.value=code||'';
  function sync(){seatsEl.querySelectorAll('button').forEach(function(b,i){b.classList.toggle('on',i+1===seat);});goBtn.disabled=!(seat>=1&&seat<=7&&/^\d{4}$/.test(codeIn.value));}

  sync();
  goBtn.addEventListener('click',function(){code=codeIn.value;lsSet('jiao.s.seat',seat);lsSet('jiao.s.code',code);join.remove();start();});

  function start(){
    var offline=code==='0000';
    root.innerHTML='<div class="bar"><span class="seat">'+seat+' 號</span><span class="ttl"></span><span class="taskpick" hidden></span><span class="net">連線中…</span></div><div class="light" hidden><span class="bulb"></span><span class="lt"></span></div><div class="wsroot" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>';
    var ttl=root.querySelector('.ttl'),net=root.querySelector('.net'),light=root.querySelector('.light'),lt=light.querySelector('.lt'),tp=root.querySelector('.taskpick');
    var skey='jiao.s.states.'+seat,states=lsGet(skey,{})||{};
    var dirty=true,saveT=null;
    var ws=new Workspace(root.querySelector('.wsroot'),{states:states,canRestart:true,onChange:function(fin){dirty=true;if(fin){clearTimeout(saveT);saveT=setTimeout(function(){lsSet(skey,states);},400);}}});
    var wait=h('div',{class:'overlay'},'<div class="big">等老師派題…</div><div class="small">'+seat+' 號・班級代碼 '+esc(code)+'</div><div class="wnet">連線中…</div><button class="btn rejoin" type="button">重新輸入座號和代碼</button>');
    wait.querySelector('.rejoin').addEventListener('click',function(){location.reload();});
    var freeze=h('div',{class:'overlay'},'<div class="big">請看老師</div><div class="small">先把手離開鍵盤和觸控板</div>');freeze.hidden=true;
    document.body.appendChild(wait);document.body.appendChild(freeze);
    function setTask(id){if(!TASK[id])return;if(ws.id!==id)ws.setTask(id);ttl.textContent=TASK[id].title+'　'+TASK[id].sub;wait.hidden=true;}
    function setLight(l){light.hidden=!l;light.className='light '+(l||'');lt.textContent=l==='g'?'做得好！拿出習作，用真的三角板做做看。':l==='r'?'請帶著 Chromebook 到老師那裡。':'';}
    function setNet(cls,t){net.className='net '+cls;net.textContent=t;var wn=wait.querySelector('.wnet');wn.className='wnet net '+cls;wn.textContent=t;}
    if(offline){
      setNet('bad','自己練習（沒有連線）');tp.hidden=false;
      TASKS.forEach(function(t){var b=h('button',{class:'btn',type:'button',style:'padding:4px 8px;font-size:14px'},esc(t.title));b.addEventListener('click',function(){setTask(t.id);});tp.appendChild(b);});
      setTask('p59a');return;
    }
    if(typeof Peer==='undefined'){setNet('bad','連線元件載入失敗');wait.querySelector('.small').textContent='請舉手告訴老師';return;}
    var peer=null,lastSend=0,lastHeard=0,TID=PREFIX+code;
    function linked(){return Date.now()-lastHeard<12000;}
    function tx(obj){relay(peer,TID,obj);}
    function onMsg(m){
      if(!m||m.src!==TID)return;
      if(m.type==='EXPIRE'){if(!linked())setNet('bad','找不到老師（代碼 '+code+' 對嗎？老師版有打開嗎？）');return;}
      var d=m.payload&&m.payload.jiao;if(!d)return;
      if(d.t==='img'){gotChunk(d);return;}
      if(d.t!=='cmd')return;
      if(!linked())dirty=true;
      lastHeard=Date.now();setNet('ok','已連線老師');
      if(d.task)setTask(d.task);freeze.hidden=!d.freeze;setLight(d.light==='g'||d.light==='r'?d.light:null);
    }
    function newPeer(){
      try{if(peer)peer.destroy();}catch(e){}
      var p=new Peer({debug:0});peer=p;
      p.on('open',function(){if(peer!==p)return;if(!p._jiao){p._jiao=1;p.socket.on('message',onMsg);}if(!linked())setNet('','找老師中…');lastSend=Date.now();tx({t:'hello',seat:seat});});
      p.on('disconnected',function(){if(peer!==p)return;setNet('','重新連線中…');setTimeout(function(){if(peer!==p)return;try{p.reconnect();}catch(e){newPeer();}},1500);});
      p.on('error',function(err){
        if(peer!==p)return;
        if(err.type==='peer-unavailable'){if(!linked())setNet('bad','找不到老師（代碼 '+code+' 對嗎？老師版有打開嗎？）');}
        else if(['network','server-error','socket-error','socket-closed','unavailable-id','browser-incompatible'].indexOf(err.type)>=0){setNet('bad','網路連不上，重試中…');setTimeout(function(){if(peer===p)newPeer();},5000);}
      });
    }
    /* workbook page images come from the teacher in small pieces */
    var imgBuf={},imgReqT={},lastChunk=0;
    function curPage(){var t=ws.id&&TASK[ws.id];return t&&t.page;}
    function requestPage(pg){
      if(PAGE_URL[pg]||!linked())return;var now=Date.now();if(imgReqT[pg]&&now-imgReqT[pg]<6000)return;imgReqT[pg]=now;
      var b=imgBuf[pg],miss=null;if(b){miss=[];for(var i=0;i<b.n;i++)if(b.parts[i]==null)miss.push(i);}
      tx({t:'img?',seat:seat,page:pg,miss:miss});
    }
    window.needPage=function(pg){requestPage(pg);};
    function gotChunk(d){
      var pg=String(d.page);if(PAGE_IDS.indexOf(pg)<0||PAGE_URL[pg])return;
      var n=parseInt(d.n,10),i=parseInt(d.i,10);if(!(n>0&&n<80&&i>=0&&i<n)||typeof d.d!=='string')return;
      lastChunk=Date.now();lastHeard=Date.now();
      var b=imgBuf[pg];if(!b||b.n!==n)b=imgBuf[pg]={n:n,parts:[],got:0};
      if(b.parts[i]==null){b.parts[i]=d.d;b.got++;}
      if(b.got===b.n){var b64=b.parts.join('');delete imgBuf[pg];setPage(pg,b64);lsSet('jiao.pg.'+pg,b64);if(curPage()===pg)ws.scene.drawBg();}
    }
    setInterval(function(){
      if(!linked()||Date.now()-lastChunk<1500)return;
      var order=[curPage()].concat(PAGE_IDS);for(var k=0;k<order.length;k++){var pg=order[k];if(pg&&!PAGE_URL[pg]){requestPage(pg);break;}}
    },1000);
    var wasLinked=false;
    setInterval(function(){
      var now=Date.now(),L=linked();
      if(wasLinked&&!L)setNet('','和老師斷線，重新連線中…');wasLinked=L;
      if(!L){if(now-lastSend>3000){lastSend=now;tx({t:'hello',seat:seat});}return;}
      if(!ws.id)return;
      if((dirty&&now-lastSend>350)||now-lastSend>4000){dirty=false;lastSend=now;tx({t:'st',seat:seat,st:fitWire(ws.state())});}
    },150);
    setInterval(function(){dropLost(peer);},5000);
    newPeer();
  }
  if(seat&&/^\d{4}$/.test(code)){/* remember last choices but still let the child confirm */}
}

  $('.vdemo').addEventListener('click',function(){setView('demo');});
  $('.frz').addEventListener('click',function(){freeze=!freeze;$('.frz').classList.toggle('on',freeze);$('.frz').textContent=freeze?'解除：讓學生繼續':'全班看老師';broadcast();});
  $('.clrall').addEventListener('click',function(){for(var n in seats)seats[n].light=null;broadcast();renderAllTiles();});
  /* QR code for students */
  var qrBox=h('div',{class:'qrwrap'});qrBox.hidden=true;
  qrBox.innerHTML='<div class="qrcard"><div class="qrimg"></div><div class="qrbig">班級代碼 <b class="qrc"></b></div><div class="qrhelp">用 Chromebook 的「相機」掃這個 QR code，點自己的座號，按「進入」。</div><div class="qrurl"></div><details><summary>學生網址設定</summary><input class="qrin" aria-label="學生網址" placeholder="https://…"><button class="btn qrsave" type="button">儲存</button></details><button class="btn qrclose" type="button">關閉</button></div>';
  document.body.appendChild(qrBox);
  function studentUrl(){var u=lsGet('jiao.t.surl','')||STUDENT_URL;return /^https?:\/\//.test(u)?u:'';}
  function showQR(){
    var u=studentUrl(),img=qrBox.querySelector('.qrimg');qrBox.querySelector('.qrc').textContent=code;qrBox.querySelector('.qrin').value=u;
    if(!u){img.innerHTML='<div class="qrnone">還沒設定學生網址，請在下面「學生網址設定」貼上。</div>';qrBox.querySelector('.qrurl').textContent='';}
    else{var full=u.split('#')[0]+'#'+code;qrBox.querySelector('.qrurl').textContent=full;try{var q=qrcode(0,'M');q.addData(full);q.make();img.innerHTML='<img alt="學生連線 QR code" src="'+q.createDataURL(10,2)+'">';}catch(e){img.innerHTML='<div class="qrnone">QR code 產生失敗</div>';}}
    qrBox.hidden=false;
  }
  $('.showqr').addEventListener('click',showQR);
  qrBox.querySelector('.qrclose').addEventListener('click',function(){qrBox.hidden=true;});
  qrBox.querySelector('.qrsave').addEventListener('click',function(){lsSet('jiao.t.surl',qrBox.querySelector('.qrin').value.trim());showQR();});
  $('.newcode').addEventListener('click',function(){code=String(ri(1000,9999));lsSet('jiao.t.code',code);$('.codev').textContent=code;startPeer();});
  /* network */
  var peer=null,tries=0;
  function sendCmd(n){var s=seats[n];if(!s.pid)return;relay(peer,s.pid,{t:'cmd',task:task,freeze:freeze,light:s.light||null});}
  function broadcast(){for(var n in seats)sendCmd(+n);}
  function onMsg(m){
    if(!m||!m.src||!m.payload||typeof m.payload.jiao!=='object')return;
    var d=m.payload.jiao;if(!d)return;var n=parseInt(d.seat,10);if(!(n>=1&&n<=7))return;var s=seats[n];
    var fresh=s.pid!==m.src||!online(s);s.pid=m.src;s.last=Date.now();
    if(d.t==='hello'||fresh)sendCmd(n);
    if(d.t==='img?')queueImg(m.src,String(d.page),Array.isArray(d.miss)?d.miss:null);
    if(d.t==='st'&&d.st&&typeof d.st==='object'&&TASK[d.st.id]){s.st=d.st;s.dirty=true;s.mdirty=true;}
  }
  var outQ=[];
  function queueImg(pid,pg,miss){
    var b64=pageB64(pg);if(!b64)return;var CH=9000,n=Math.ceil(b64.length/CH);
    for(var i=0;i<n;i++){if(miss&&miss.length&&miss.indexOf(i)<0)continue;var dup=false;for(var j=0;j<outQ.length;j++){var q=outQ[j];if(q.pid===pid&&q.pg===pg&&q.i===i){dup=true;break;}}if(!dup)outQ.push({pid:pid,pg:pg,i:i,n:n,d:b64.substr(i*CH,CH)});}
  }
  var pumpT=Date.now();
  setInterval(function(){var now=Date.now(),k=Math.min(20,Math.max(2,Math.floor((now-pumpT)/20)));pumpT=now;while(k-->0&&outQ.length){var q=outQ.shift();relay(peer,q.pid,{t:'img',page:q.pg,i:q.i,n:q.n,d:q.d});}},40);
  function startPeer(){
    if(typeof Peer==='undefined'){setNet('bad','連線元件載入失敗');return;}
    try{if(peer)peer.destroy();}catch(e){}
    setNet('','連線中…');
    var p=new Peer(PREFIX+code,{debug:0});peer=p;
    p.on('open',function(){if(peer!==p)return;tries=0;if(!p._jiao){p._jiao=1;p.socket.on('message',onMsg);}setNet('ok','學生可以連進來了');broadcast();});
    p.on('disconnected',function(){if(peer!==p)return;setNet('','重新連線中…');setTimeout(function(){if(peer!==p)return;try{p.reconnect();}catch(e){startPeer();}},2000);});
    p.on('error',function(err){
      if(peer!==p)return;
      if(err.type==='unavailable-id'){tries++;setNet('','代碼準備中…（剛關掉的老師版還沒釋放，請稍等）');try{p.destroy();}catch(e){}setTimeout(startPeer,4000);}
      else if(['network','server-error','socket-error','socket-closed','browser-incompatible'].indexOf(err.type)>=0){setNet('bad','連不上連線伺服器，5 秒後重試（請確認這台電腦有網路）');try{p.destroy();}catch(e){}setTimeout(startPeer,5000);}
    });
  }
  setInterval(function(){renderAllTiles();if(modalSeat!=null&&!modal.hidden)renderModal();},300);
  setInterval(broadcast,4000);
  setInterval(function(){dropLost(peer);},5000);
  syncTaskBtns();demo.setTask(task);setView('grid');startPeer();
}

if(ROLE==='teacher')TeacherApp();else StudentApp();
</script>
</body>
