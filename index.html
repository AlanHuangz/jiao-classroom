<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>角的教室・學生</title>
<style>
/* 版面：上方工具列＋左側工具＋中間大舞台（習作原頁或練習題）；老師端多一個 7 格監看牆 */
:root{
  --bg:#e9eef2; --paper:#ffffff; --ink:#1c2a38; --muted:#5d6b78; --line:#cdd8e0; --stage:#dde5eb;
  --accent:#2a6fb0; --green:#1d9a52; --red:#d3392a; --amber:#c98a00;
  --f:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:16px;overflow:hidden}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:16px;line-height:1.25}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:auto minmax(0,1fr);flex:1;min-height:0}
.ws-tools{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;width:124px}
.ws-tools .btn{width:100%;padding:8px 4px;font-size:15px}
.ws-tools .sep{height:1px;background:var(--line);margin:4px 0;flex:none}
.ws-tools .cap{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.05em}
.sw{display:flex;gap:6px;justify-content:center}
.sw button{width:28px;height:28px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.row2{display:flex;gap:6px}
.row2 .btn{flex:1}
.ws-main{display:flex;flex-direction:column;min-width:0;min-height:0}
.ws-stagewrap{position:relative;flex:1;min-height:0;background:var(--stage)}
.ws-stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
.ws-hint{transition:opacity .6s;position:absolute;left:10px;bottom:10px;background:rgba(28,42,56,.86);color:#fff;padding:6px 12px;border-radius:8px;font-size:15px;pointer-events:none;max-width:calc(100% - 20px)}
.ws-ans{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;background:var(--paper);border-top:1px solid var(--line)}
.ws-ans:empty{display:none}
.ans-status{font-size:18px;margin-right:auto;font-variant-numeric:tabular-nums}
.ans-btn{font-size:21px;padding:9px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--paper)}
.ans-btn .sym{font-weight:700;margin-left:4px}
.ans-btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.ans-btn.no{background:var(--red);border-color:var(--red);color:#fff}
.ans-btn.right{box-shadow:0 0 0 4px var(--green)}
.next-btn{font-size:21px;padding:9px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:#fff}

/* ---------- svg ---------- */
.s-paper{fill:#fff}
.s-out{fill:#dde5eb}
.s-grid50{fill:url(#grid50)}.s-gridlines{fill:url(#gridl50);pointer-events:none}.s-dots{fill:#fff}.s-dotsover{fill:url(#dot50);pointer-events:none}
.sh-fill{stroke:none}.shf0{fill:#bfe0f5}.shf1{fill:#f7d59a}.shf2{fill:#d9efc8}
.sh-edge{fill:none;stroke:#1c2a38;stroke-width:3;stroke-linecap:round;pointer-events:none}.she2{stroke:#2f8f3a}
.sh-lbl{font-size:34px;font-weight:700;fill:#1c2a38;text-anchor:middle}
.paint{fill:#ffb347;fill-opacity:.5;stroke:#c97a10;stroke-width:1.5;pointer-events:none}
.paint-n{fill:#7a3d00;font-weight:700;text-anchor:middle;pointer-events:none}
.tile{fill:#fbfbf8;stroke:#8d99a4;stroke-width:2;cursor:move}
.a-sel.tile,.a-sel .sheet-o,.a-sel .piece-b{stroke:#1565a0;stroke-width:4}
.sheet-b{fill:#cfe6fa;fill-opacity:.28;cursor:move}
.sheet-l{stroke:#3d8fd1;stroke-width:1.5;fill:none;pointer-events:none}
.sheet-o{fill:none;stroke:#2373b8;stroke-width:3;pointer-events:none}
.sheet-t{fill:#2373b8;font-size:20px;pointer-events:none}
.s-knob{fill:#2373b8;cursor:grab}
.piece-b{fill:var(--pc);fill-opacity:.42;stroke:#1c2a38;stroke-width:2.5;cursor:move;filter:drop-shadow(2px 3px 2px rgba(0,0,0,.25))}
.piece-b.piece-c{fill:transparent;stroke:none;filter:none}
.piece-b.piece-c.lift{fill:var(--pc);fill-opacity:.08;stroke:var(--pc);stroke-width:4;filter:drop-shadow(3px 5px 4px rgba(0,0,0,.35))}
.p-knob{fill:#1c2a38;fill-opacity:.75;cursor:grab}
.hole{fill:#ffffff;fill-opacity:.92;stroke:#d3392a;stroke-width:2.5;stroke-dasharray:8 6;pointer-events:none}
.hole-dot{fill:#8a96a0;pointer-events:none}.hole-lat{fill:none;stroke:#b9c6d0;stroke-width:1.5;pointer-events:none}.hole-g{fill:url(#grid50)}.hole-d{fill:url(#dot50)}.hole-o{fill:none}
.cut-line{fill:none;stroke:#d3392a;stroke-width:3;stroke-dasharray:9 6}.cut-dot{fill:#d3392a}
.ans-n{font-size:24px;font-weight:700;fill:#1c2a38;text-anchor:middle;pointer-events:none}
.ans-h{font-size:22px;font-weight:700;fill:#b5600a;text-anchor:middle;pointer-events:none}
.pair-ok{fill:#1d9a52;fill-opacity:.35;pointer-events:none}
.pair-n{font-size:30px;font-weight:700;fill:#0f5e31;text-anchor:middle;pointer-events:none}
.s-wait{fill:#5d6b78;font-size:44px;text-anchor:middle}
.b-sel .b-body,.b-sel .r-body{stroke-width:5;stroke:#1565a0}
.r-body{fill:#fff3b8;fill-opacity:.8;stroke:#a88512;stroke-width:2.5;cursor:move}.r-tick{stroke:#4a3d0c;stroke-width:1.8;pointer-events:none}
.r-num{font-size:21px;font-weight:700;fill:#4a3d0c;text-anchor:middle;pointer-events:none}.r-unit{font-size:16px;fill:#4a3d0c;text-anchor:middle;pointer-events:none}
.s-grid{fill:url(#gridpat)}
.ink{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.q-side{stroke:#1c2a38;stroke-width:7;stroke-linecap:round;fill:none}
.q-arc{stroke:#2a6fb0;stroke-width:4;fill:none}
.q-vtx{fill:#1c2a38}
.a-fill{fill:#f2a54a;fill-opacity:.38}
.a-lbl{fill:#b5600a;font-size:34px;font-weight:700;text-anchor:middle}
.b-body{fill:#5ab4e6;fill-opacity:.30;stroke:#2386c0;stroke-width:3;cursor:move}
.b-tick{stroke:#2386c0;stroke-width:2;pointer-events:none}
.b-corner{fill:none;stroke:#d3392a;stroke-width:3;pointer-events:none}
.b-pivot{fill:#d3392a;pointer-events:none}
.knob{fill:#2386c0;cursor:grab}
.knob-t{fill:#fff;font-size:30px;text-anchor:middle;font-weight:700;pointer-events:none}
.c-fill{fill:var(--cc);fill-opacity:.15;cursor:move}
.c-hit{stroke:transparent;stroke-width:34;fill:none;cursor:move;stroke-linecap:round}
.c-line{stroke:var(--cc);stroke-width:6;fill:none;stroke-linecap:round;pointer-events:none}
.c-arc{stroke:var(--cc);stroke-width:3;fill:none;pointer-events:none}
.c-vtx{fill:var(--cc);pointer-events:none}
.c-lbl{fill:var(--cc);font-size:32px;font-weight:700;text-anchor:middle;pointer-events:none}
.c-knob{fill:var(--cc);cursor:grab}
.bn-ok{fill:#1d9a52}.bn-no{fill:#d3392a}
.bn-t{fill:#fff;font-size:38px;font-weight:700;text-anchor:middle}
.rmark{stroke:#1d9a52;stroke-width:5;fill:none}
.tr-dot{fill:#d3392a}.tr-line{stroke:#d3392a;stroke-width:3;stroke-dasharray:8 6;fill:none}
.done-bg{fill:#fff;fill-opacity:.94}
.done-t{fill:#1c2a38;font-size:56px;font-weight:700;text-anchor:middle}
.done-s{fill:#5d6b78;font-size:30px;text-anchor:middle}

/* ---------- student ---------- */
.bar{display:flex;align-items:center;gap:10px 16px;padding:8px 14px;background:var(--ink);color:#fff;flex-wrap:wrap}
.bar .seat{font-size:22px;font-weight:700}
.bar .ttl{font-size:18px}
.net{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-left:auto}
.net::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--amber)}
.net.ok::before{background:#3ccf7a}.net.bad::before{background:#ff6b5b}
.light{display:flex;align-items:center;gap:14px;padding:12px 18px;font-size:26px;font-weight:700;color:#fff}
.light.g{background:var(--green)}.light.r{background:var(--red)}
.light .bulb{width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 0 0 6px rgba(255,255,255,.35);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,255,255,.12)}}
@media (prefers-reduced-motion:reduce){.light .bulb{animation:none}}
.overlay{position:fixed;inset:0;background:rgba(28,42,56,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;text-align:center;padding:20px}
.overlay .big{font-size:56px;font-weight:700}
.overlay .small{font-size:22px;opacity:.85}
.overlay .wnet{font-size:24px;margin:0}
.overlay .rejoin{margin-top:12px;background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.join{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;overflow:auto}
.join-card{background:var(--paper);border-radius:18px;padding:28px;max-width:640px;width:100%;display:flex;flex-direction:column;gap:18px;box-shadow:0 10px 40px rgba(28,42,56,.12)}
.join-card h1{margin:0;font-size:34px}
.join-card .lbl{font-size:18px;color:var(--muted)}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.seats button.s8{font-size:20px;line-height:1.1;background:#eef4f8}.seats button.s8 small{display:block;font-size:12px;font-weight:600}
.tile.t8 footer{display:none}.tile.t8 .seatno{color:var(--blue,#2a6fb0)}
.seats button{font-size:28px;font-weight:700;padding:14px 0;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.seats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.codein{font-size:40px;letter-spacing:.3em;text-align:center;padding:8px;border:2px solid var(--line);border-radius:12px;width:100%}
.go{font-size:26px;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700}
.go:disabled{opacity:.4}
.taskpick{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- teacher ---------- */
.t-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;background:var(--ink);color:#fff}
.t-head h1{margin:0;font-size:24px}
.code{font-size:18px;display:flex;align-items:center;gap:8px}
.code b{font-size:32px;letter-spacing:.14em;background:#fff;color:var(--ink);padding:0 12px;border-radius:8px;font-variant-numeric:tabular-nums}
.t-head .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);padding:6px 10px;font-size:15px}
.t-head .btn.on{background:#fff;color:var(--ink)}
.t-tasks{display:flex;flex-wrap:wrap;gap:5px;max-height:128px;overflow-y:auto;padding:6px 16px;background:var(--paper);border-bottom:1px solid var(--line);align-items:center}
.t-tasks .lead{font-weight:700;margin-right:4px}
.task-btn{text-align:left;padding:3px 9px;font-size:14px;line-height:1.2}
.task-btn small{display:block;font-size:11px;color:var(--muted)}
.task-btn.on small{color:#cfd9e1}
.t-main{flex:1;min-height:0;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;padding:10px 16px;overflow:auto;flex:1;align-content:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--paper);border:4px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tile.lg-g{border-color:var(--green)}.tile.lg-r{border-color:var(--red)}
.tile header{display:flex;align-items:center;gap:8px;padding:6px 10px}
.tile .seatno{font-size:22px}
.tile .nm{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);font-size:17px;padding:2px 4px;background:transparent}
.dot{width:12px;height:12px;border-radius:50%;background:#b8c3cc;flex:none}
.dot.on{background:#2fbf6a}
.tile-stage{position:relative;height:clamp(170px,calc(50vh - 215px),440px);background:var(--stage);cursor:zoom-in}
.tile-stage svg{width:100%;height:100%;display:block}
.tile-stage .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;background:rgba(221,229,235,.8)}
.tile-sum{padding:6px 10px 0;font-size:15px;min-height:24px}
.tile-sum .warn{color:var(--red);font-weight:700}
.tile-sum .good{color:var(--green);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px;padding:4px 10px 0;min-height:14px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i.ok{background:var(--green)}.dots i.no{background:var(--red)}
.dots i.na{background:transparent;box-shadow:inset 0 0 0 2px currentColor}
.dots i.na.ok{color:var(--green)}.dots i.na.no{color:var(--red)}
.tile footer{display:flex;gap:6px;padding:8px 10px}
.lg{flex:1;border-radius:9px;border:2px solid;padding:6px 4px;font-size:14px;font-weight:700;background:var(--paper)}
.lg.gbtn{border-color:var(--green);color:var(--green)}
.lg.rbtn{border-color:var(--red);color:var(--red)}
.lg.gbtn.on{background:var(--green);color:#fff}
.lg.rbtn.on{background:var(--red);color:#fff}
.lg.cbtn{flex:.6;border-color:var(--line);color:var(--muted)}
.legend{padding:0 16px 10px;font-size:14px;color:var(--muted)}
.demo{flex:1;min-height:0;display:flex;flex-direction:column}
.qrwrap{position:fixed;inset:0;background:rgba(28,42,56,.8);z-index:45;display:flex;align-items:center;justify-content:center;padding:16px}
.qrcard{background:var(--paper);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:640px;width:100%;max-height:100%;overflow:auto}
.qrimg img{width:min(420px,70vh);height:auto;image-rendering:pixelated;display:block}
.qrnone{padding:40px 10px;color:var(--red);font-size:18px;text-align:center}
.qrbig{font-size:30px}.qrbig b{font-size:46px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.qrhelp{font-size:18px;color:var(--muted);text-align:center}
.qrurl{font-size:15px;word-break:break-all;color:var(--accent)}
.qrcard details{width:100%;font-size:15px}.qrcard details input{width:100%;margin:6px 0;padding:6px 8px;border:2px solid var(--line);border-radius:8px}
.units{display:inline-flex;gap:4px;margin-right:8px;padding-right:10px;border-right:2px solid var(--line)}
.unit-btn{padding:6px 10px;font-weight:700}
.subj-btn{padding:6px 14px;font-weight:800;font-size:17px}
.ink.hl{stroke-width:26;stroke-opacity:.42}
.ws-count{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.95);border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-size:22px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
.num-disp{min-width:150px;font-size:30px;font-weight:700;padding:4px 14px;border:2px solid var(--line);border-radius:12px;text-align:center;font-variant-numeric:tabular-nums}
.num-disp small{font-size:16px;font-weight:400}
.num-disp .ph{color:var(--line)}
.num-disp.ok{border-color:var(--green);color:var(--green)}.num-disp.no{border-color:var(--red);color:var(--red)}
.pad{display:flex;flex-wrap:wrap;gap:4px}
.pad-btn{width:44px;height:44px;font-size:22px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.pad-btn:disabled,.ok-btn:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(28,42,56,.7);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--paper);border-radius:14px;width:min(1400px,100%);height:100%;display:flex;flex-direction:column;overflow:hidden}
.modal-card header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-card header b{font-size:24px}
.modal-card .msum{font-size:17px;margin-right:auto}
.modal-stage{flex:1;min-height:0;background:var(--stage)}
.modal-stage svg{width:100%;height:100%;display:block}
.modal-card .lg{flex:none;padding:8px 14px;font-size:16px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="grid50" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#ffffff"/><path d="M60 0H0V60" fill="none" stroke="#cdd8e0" stroke-width="1.5"/></pattern>
    <pattern id="gridl50" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#9fb0bd" stroke-width="1.2"/></pattern>
    <pattern id="dot50" width="60" height="60" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r="4" fill="#6b7a86"/><circle cx="60" cy="0" r="4" fill="#6b7a86"/><circle cx="0" cy="60" r="4" fill="#6b7a86"/><circle cx="60" cy="60" r="4" fill="#6b7a86"/></pattern>
    <pattern id="gridpat" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff"/>
      <path d="M40 0H0V40" fill="none" stroke="#e3eaf0" stroke-width="2"/>
    </pattern>
  </defs>
</svg>

/* ---- random shapes on the grid ---- */
function genShape(n,maxW,maxH,spread,t){

  return s;
}

    var ttl=root.querySelector('.ttl'),net=root.querySelector('.net'),light=root.querySelector('.light'),lt=light.querySelector('.lt'),tp=root.querySelector('.taskpick');
    var skey='jiao.s.states.'+seat,states=lsGet(skey,{})||{};
    var dirty=true,saveT=null;
    var ws=new Workspace(root.querySelector('.wsroot'),{states:states,canRestart:true,onZiSubmit:function(sub,task){ziSend(sub,task);},onChange:function(fin){dirty=true;if(fin){clearTimeout(saveT);saveT=setTimeout(function(){lsSet(skey,states);},400);}}});
    var wait=h('div',{class:'overlay'},'<div class="big">等老師派題…</div><div class="small">'+seat+' 號・班級代碼 '+esc(code)+'</div><div class="wnet">連線中…</div><button class="btn rejoin" type="button">重新輸入座號和代碼</button>');
    wait.querySelector('.rejoin').addEventListener('click',function(){location.reload();});
    var freeze=h('div',{class:'overlay'},'<div class="big">請看老師</div><div class="small">先把手離開鍵盤和觸控板</div>');freeze.hidden=true;
    document.body.appendChild(wait);document.body.appendChild(freeze);
    function setTask(id){if(!TASK[id])return;if(ws.id!==id)ws.setTask(id);ttl.textContent=TASK[id].title+'　'+TASK[id].sub;wait.hidden=true;}
    function setLight(l){light.hidden=!l;light.className='light '+(l||'');lt.textContent=l==='g'?((ws&&ws.id&&TASK[ws.id]&&TASK[ws.id].subj==='zh')?'做得好！拿出國語課本，自己做做看。':'做得好！拿出習作，用真的三角板做做看。'):l==='r'?'請帶著 Chromebook 到老師那裡。':'';}
    var ziSent={};
    function ziSend(sub,task){ziSent[sub.id]=Date.now();tx({t:'zsub',seat:seat,task:task,sub:sub});}
    function ziCmd(z){var st=states[z.task];if(!st||st.k!=='zi'||!st.subs)return;
      (z.need||[]).forEach(function(id){for(var i=0;i<st.subs.length;i++){var sb=st.subs[i];if(sb.id===id&&!(ziSent[id]&&Date.now()-ziSent[id]<2500))ziSend(sb,z.task);}});
      var res=ziApply(st,z.r);if(!res.changed)return;dirty=true;lsSet(skey,states);
      if(ws.zi&&ws.id===z.task){ws.zi.renderMine();if(res.ok.length)ws.zi.toast('老師說：你造出了「'+res.ok.join('」「')+'」！',true);else if(res.no)ws.zi.toast('有一個字，老師請你再想想');}}
    function setNet(cls,t){net.className='net '+cls;net.textContent=t;var wn=wait.querySelector('.wnet');wn.className='wnet net '+cls;wn.textContent=t;}
    if(offline){
      setNet('bad','自己練習（沒有連線）');tp.hidden=false;
      TASKS.forEach(function(t){var b=h('button',{class:'btn',type:'button',style:'padding:4px 8px;font-size:14px'},esc(t.title));b.addEventListener('click',function(){setTask(t.id);});tp.appendChild(b);});
      setTask('p59a');return;
    }
    if(typeof Peer==='undefined'){setNet('bad','連線元件載入失敗');wait.querySelector('.small').textContent='請舉手告訴老師';return;}
    var peer=null,lastSend=0,lastHeard=0,TID=PREFIX+code;
    function linked(){return Date.now()-lastHeard<12000;}
    function tx(obj){relay(peer,TID,obj);}
    function onMsg(m){
      if(!m||m.src!==TID)return;
      if(m.type==='EXPIRE'){if(!linked())setNet('bad','找不到老師（代碼 '+code+' 對嗎？老師版有打開嗎？）');return;}
      var d=m.payload&&m.payload.jiao;if(!d)return;
      if(d.t==='img'){gotChunk(d);return;}
      if(d.t!=='cmd')return;
      if(!linked())dirty=true;
      lastHeard=Date.now();setNet('ok','已連線老師');
      if(d.task)setTask(d.task);if(d.zi&&typeof d.zi==='object')ziCmd(d.zi);freeze.hidden=seat===8||!d.freeze;setLight(seat!==8&&(d.light==='g'||d.light==='r')?d.light:null);
    }
    function newPeer(){
      try{if(peer)peer.destroy();}catch(e){}
      var p=new Peer({debug:0});peer=p;
      p.on('open',function(){if(peer!==p)return;if(!p._jiao){p._jiao=1;p.socket.on('message',onMsg);}if(!linked())setNet('','找老師中…');lastSend=Date.now();tx({t:'hello',seat:seat});});
      p.on('disconnected',function(){if(peer!==p)return;setNet('','重新連線中…');setTimeout(function(){if(peer!==p)return;try{p.reconnect();}catch(e){newPeer();}},1500);});
      p.on('error',function(err){
        if(peer!==p)return;
        if(err.type==='peer-unavailable'){if(!linked())setNet('bad','找不到老師（代碼 '+code+' 對嗎？老師版有打開嗎？）');}
        else if(['network','server-error','socket-error','socket-closed','unavailable-id','browser-incompatible'].indexOf(err.type)>=0){setNet('bad','網路連不上，重試中…');setTimeout(function(){if(peer===p)newPeer();},5000);}
      });
    }
    /* workbook page images come from the teacher in small pieces */
    var imgBuf={},imgReqT={},lastChunk=0;
    function curPage(){var t=ws.id&&TASK[ws.id];return t&&t.page;}
    function requestPage(pg){
      if(PAGE_URL[pg]||!linked())return;var now=Date.now();if(imgReqT[pg]&&now-imgReqT[pg]<6000)return;imgReqT[pg]=now;
      var b=imgBuf[pg],miss=null;if(b){miss=[];for(var i=0;i<b.n;i++)if(b.parts[i]==null)miss.push(i);}
      tx({t:'img?',seat:seat,page:pg,miss:miss});
    }
    window.needPage=function(pg){requestPage(pg);};
    function gotChunk(d){
      var pg=String(d.page);if(PAGE_IDS.indexOf(pg)<0||PAGE_URL[pg])return;
      var n=parseInt(d.n,10),i=parseInt(d.i,10);if(!(n>0&&n<80&&i>=0&&i<n)||typeof d.d!=='string')return;
      lastChunk=Date.now();lastHeard=Date.now();
      var b=imgBuf[pg];if(!b||b.n!==n)b=imgBuf[pg]={n:n,parts:[],got:0};
      if(b.parts[i]==null){b.parts[i]=d.d;b.got++;}
      if(b.got===b.n){var b64=b.parts.join('');delete imgBuf[pg];setPage(pg,b64);cachePage(pg,b64);if(curPage()===pg)ws.scene.drawBg();}
    }
    setInterval(function(){
      if(!linked()||Date.now()-lastChunk<1500)return;
      var t0=ws.id&&TASK[ws.id],u0=t0?(t0.unit||'').split(' '):[];
      var order=[curPage()].concat(TASKS.filter(function(t){return t.page&&(t.unit||'').split(' ').some(function(u){return u0.indexOf(u)>=0;});}).map(function(t){return t.page;}));
      for(var k=0;k<order.length;k++){var pg=order[k];if(pg&&!PAGE_URL[pg]){requestPage(pg);break;}}
    },1000);
    var wasLinked=false;
    setInterval(function(){
      var now=Date.now(),L=linked();
      if(wasLinked&&!L)setNet('','和老師斷線，重新連線中…');wasLinked=L;
      if(!L){if(now-lastSend>3000){lastSend=now;tx({t:'hello',seat:seat});}return;}
      if(!ws.id)return;
      if((dirty&&now-lastSend>350)||now-lastSend>4000){dirty=false;lastSend=now;tx({t:'st',seat:seat,st:fitWire(ws.state())});}
    },150);
    setInterval(function(){dropLost(peer);},5000);
    newPeer();
  }
  if(seat&&/^\d{4}$/.test(code)){/* remember last choices but still let the child confirm */}
}

  /* network */
  var peer=null,tries=0;
  function sendCmd(n){var s=seats[n];if(!s.pid)return;relay(peer,s.pid,{t:'cmd',task:task,freeze:n===8?false:freeze,light:n===8?null:(s.light||null),zi:Z?Z.cmdFor(n):undefined});s.zt=Date.now();}
  function broadcast(){for(var n in seats)sendCmd(+n);}
  function onMsg(m){
    if(!m||!m.src||!m.payload||typeof m.payload.jiao!=='object')return;
    var d=m.payload.jiao;if(!d)return;var n=parseInt(d.seat,10);if(!(n>=1&&n<=8))return;var s=seats[n];
    var fresh=s.pid!==m.src||!online(s);s.pid=m.src;s.last=Date.now();
    if(d.t==='hello'||fresh)sendCmd(n);
    if(d.t==='img?')queueImg(m.src,String(d.page),Array.isArray(d.miss)?d.miss:null);
    if(d.t==='st'&&d.st&&typeof d.st==='object'&&TASK[d.st.id]){s.st=d.st;s.dirty=true;s.mdirty=true;if(d.st.k==='zi'&&Date.now()-s.zt>1500&&Z.needs(n,d.st))sendCmd(n);}
    if(d.t==='zsub'&&d.sub&&typeof d.sub==='object'&&TASK[d.task]&&TASK[d.task].kind==='zi'){Z.onSub(n,d.sub,d.task);sendCmd(n);}
  }
  var outQ=[];
  function queueImg(pid,pg,miss){
    var b64=pageB64(pg);if(!b64)return;var CH=9000,n=Math.ceil(b64.length/CH);
    for(var i=0;i<n;i++){if(miss&&miss.length&&miss.indexOf(i)<0)continue;var dup=false;for(var j=0;j<outQ.length;j++){var q=outQ[j];if(q.pid===pid&&q.pg===pg&&q.i===i){dup=true;break;}}if(!dup)outQ.push({pid:pid,pg:pg,i:i,n:n,d:b64.substr(i*CH,CH)});}
  }
  var pumpT=Date.now();
  setInterval(function(){var now=Date.now(),k=Math.min(20,Math.max(2,Math.floor((now-pumpT)/20)));pumpT=now;while(k-->0&&outQ.length){var q=outQ.shift();relay(peer,q.pid,{t:'img',page:q.pg,i:q.i,n:q.n,d:q.d});}},40);
  function startPeer(){
    if(typeof Peer==='undefined'){setNet('bad','連線元件載入失敗');return;}
    try{if(peer)peer.destroy();}catch(e){}
    setNet('','連線中…');
    var p=new Peer(PREFIX+code,{debug:0});peer=p;
    p.on('open',function(){if(peer!==p)return;tries=0;if(!p._jiao){p._jiao=1;p.socket.on('message',onMsg);}setNet('ok','學生可以連進來了');broadcast();});
    p.on('disconnected',function(){if(peer!==p)return;setNet('','重新連線中…');setTimeout(function(){if(peer!==p)return;try{p.reconnect();}catch(e){startPeer();}},2000);});
    p.on('error',function(err){
      if(peer!==p)return;
      if(err.type==='unavailable-id'){tries++;setNet('','代碼準備中…（剛關掉的老師版還沒釋放，請稍等）');try{p.destroy();}catch(e){}setTimeout(startPeer,4000);}
      else if(['network','server-error','socket-error','socket-closed','browser-incompatible'].indexOf(err.type)>=0){setNet('bad','連不上連線伺服器，5 秒後重試（請確認這台電腦有網路）');try{p.destroy();}catch(e){}setTimeout(startPeer,5000);}
    });
  }
  setInterval(function(){renderAllTiles();if(modalSeat!=null&&!modal.hidden)renderModal();},300);
  setInterval(broadcast,4000);
  setInterval(function(){dropLost(peer);},5000);
  syncTaskBtns();demo.setTask(task);setView('grid');startPeer();
}

if(ROLE==='teacher')TeacherApp();else StudentApp();
</script>
