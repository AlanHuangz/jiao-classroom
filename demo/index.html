<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上教室 體驗館</title>
<style>
:root{--bg:#dfe7ee;--paper:#fff;--ink:#1d2b36;--muted:#61727f;--line:#d5dee5;--brand:#2a6fb0;--brand2:#e8930c;--ok:#1f9d55;--f:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit}
/* ---- 上方：一條細細的工具列 ---- */
header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--line);min-height:48px}
header h1{font-size:17px;margin:0;white-space:nowrap}
.steps{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding:2px}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;font-size:13px;border:none;background:#eef2f5;color:var(--muted);border-radius:999px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.steps button.on{background:var(--brand2);color:#fff;font-weight:800}
.steps button.done{background:#e3f4ea;color:var(--ok)}
.seg{display:flex;background:#eef2f5;border-radius:999px;padding:3px;flex:none}
.seg button{font-size:14px;font-weight:700;border:none;background:none;color:var(--muted);border-radius:999px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,40,60,.2)}
.seg button[hidden]{display:none}
header a.how{flex:none;font-size:14px;font-weight:800;color:#a35f00;text-decoration:none;border:2px solid #f0c06a;background:#fff7e6;border-radius:999px;padding:4px 11px;white-space:nowrap}
/* ---- 主體：左邊窄窄的說明，右邊是體驗區 ---- */
main{flex:1;display:flex;min-height:0}
.guide{width:310px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:width .2s}
.ghead{display:flex;align-items:center;gap:8px;padding:10px 12px 0}
.ghead .chap{font-size:13px;font-weight:800;color:var(--brand2)}
.ghead .cnt{font-size:12px;color:var(--muted)}
.ghead .fold{margin-left:auto;border:none;background:#eef2f5;color:var(--muted);border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
.card{flex:1;overflow:auto;padding:4px 14px 12px}
.card h2{font-size:18px;margin:4px 0 6px;line-height:1.35}
.card .lead{font-size:14.5px;line-height:1.6;margin:0 0 8px;color:#33434f}
.who{display:inline-block;font-size:12px;font-weight:800;border-radius:6px;padding:1px 8px}
.who.s{background:#e3f1ff;color:#1d5c99}.who.t{background:#e9f8ef;color:#17703c}
.do{background:#fff8e6;border:2px solid #f5c95c;border-radius:12px;padding:8px 10px 8px 8px;margin:8px 0}
.do.look{background:#eef7f1;border-color:#a8dcb9}
.do b.h{display:block;font-size:13.5px;color:#8a5a00;margin:0 0 2px 4px}
.do.look b.h{color:#17703c}
.do ol,.do ul{margin:0;padding-left:22px}.do li{margin:4px 0;line-height:1.5;font-size:14.5px}
.tip{font-size:13.5px;line-height:1.55;color:#4a5a66;background:#f3f6f8;border-radius:8px;padding:6px 9px;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.two div{border-radius:10px;padding:6px 8px;font-size:13.5px;line-height:1.45}
.two .e{background:#e9f8ef}.two .i{background:#e3f1ff}.two b{display:block}
details.more{margin:8px 0;font-size:13.5px;line-height:1.6;color:#4a5a66}
details.more summary{cursor:pointer;font-weight:700;color:var(--brand);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:'▸ '}details.more[open] summary::before{content:'▾ '}
details.more p{margin:6px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.act{font-size:14px;font-weight:700;border:2px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:5px 10px;cursor:pointer}
.act:hover{background:#eaf3fb}
.nav{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line);background:#fafcfd}
.nav button{font-size:15px;font-weight:800;border-radius:10px;padding:8px 12px;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink)}
.nav .nx{flex:1;background:var(--brand2);border-color:var(--brand2);color:#fff}
.nav button:disabled{opacity:.45;cursor:default}
/* 收起來：只剩一條，體驗區更大 */
.rail{display:none;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.rail button{border:none;border-radius:10px;cursor:pointer;font-weight:800}
.rail .open{background:#eef2f5;color:var(--muted);font-size:13px;padding:8px 6px;writing-mode:vertical-rl;letter-spacing:2px}
.rail .rn{font-size:13px;color:var(--muted);text-align:center;line-height:1.3}
.rail .rnx{background:var(--brand2);color:#fff;font-size:18px;width:38px;height:38px}
.rail .rpv{background:#eef2f5;color:var(--ink);font-size:18px;width:38px;height:38px}
.rail button:disabled{opacity:.4;cursor:default}
body.folded .guide{width:56px}
body.folded .guide>:not(.rail){display:none}
body.folded .rail{display:flex}
/* ---- 體驗區 ---- */
.stage{flex:1;position:relative;min-width:0;display:flex;gap:10px;padding:8px 10px 10px;align-items:flex-start;justify-content:center}
.fr{position:relative;flex:none;display:flex;flex-direction:column;gap:4px}
.fr[hidden]{display:none}
.fr .lab{font-size:13px;font-weight:800;color:#45555f;display:flex;align-items:center;gap:6px;height:20px}
.fr .lab i{font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:#fff}
.box{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 3px 14px rgba(20,40,60,.22);background:#fff}
.box iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0}
.flash{animation:fl 1.2s 2}@keyframes fl{50%{box-shadow:0 0 0 6px rgba(232,147,12,.75)}}
.bots{position:absolute;left:-3000px;top:0;width:1200px;height:700px;border:0}
@media (max-width:1100px){header h1{display:none}}
@media (max-width:760px){
  header{flex-wrap:wrap}.steps{order:3;flex-basis:100%}
  main{flex-direction:column}
  .stage{order:1;flex:1}
  .guide{order:2;width:auto;max-height:44vh;border-right:none;border-top:1px solid var(--line)}
  body.folded .guide{width:auto;max-height:none}
  body.folded .rail{flex-direction:row;justify-content:center;padding:6px}
  .rail .open{writing-mode:horizontal-tb;letter-spacing:0}
}
</style>
</head>
<body>
<header>
  <h1>🏫 線上教室 體驗館</h1>
  <nav class="steps" aria-label="體驗步驟"></nav>
  <div class="seg" role="group" aria-label="切換畫面">
    <button data-v="stu" type="button">🧒 學生平板</button>
    <button data-v="tea" type="button">👩‍🏫 老師畫面</button>
    <button data-v="both" type="button">⬌ 並排</button>
  </div>
  <a class="how" href="agent.html" target="_blank" rel="noopener">🤖 怎麼做出來的？</a>
</header>
<main>
  <aside class="guide">
    <div class="ghead"><span class="chap"></span><span class="cnt"></span><button class="fold" type="button" title="收起說明，讓體驗區變大">收起 ◀</button></div>
    <div class="card"></div>
    <div class="nav"><button class="pv" type="button">◀</button><button class="nx" type="button">下一步 ▶</button></div>
    <div class="rail"><button class="open" type="button" title="打開說明">說明 ▶</button><div class="rn"></div><button class="rpv" type="button" title="上一步">◀</button><button class="rnx" type="button" title="下一步">▶</button></div>
  </aside>
  <section class="stage">
    <div class="fr stu"><div class="lab">🧒 學生平板 <i>你是 1 號</i></div><div class="box"><iframe title="學生平板" id="fs" allow="fullscreen"></iframe></div></div>
    <div class="fr tea"><div class="lab">👩‍🏫 老師畫面 <i>全班 7 人，即時更新</i></div><div class="box"><iframe title="老師畫面" id="ft" allow="fullscreen"></iframe></div></div>
  </section>
</main>
<iframe class="bots" id="fb" title="模擬同學" aria-hidden="true" tabindex="-1"></iframe>
<script>
(function(){
  /* 每次打開都是一間新的教室 */
  try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf('xp:')===0)localStorage.removeItem(k);}}catch(e){}
  var room=Math.random().toString(36).slice(2,10);
  var ft=document.getElementById('ft'),fs=document.getElementById('fs'),fb=document.getElementById('fb');
  ft.src='app.html?role=teacher&room='+room;
  setTimeout(function(){fb.src='app.html?role=bots&room='+room;fs.src='app.html?role=student&room='+room+'#2468-1';},700);
  var VW=1280,VH=800,view='stu';
  function fit(){
    var st=document.querySelector('.stage'),W=st.clientWidth-20,H=st.clientHeight-18-24;
    var show=view==='both'?['stu','tea']:[view],sc,stack=false;
    if(view==='both'){var a=Math.min((W-10)/2/VW,H/VH),b=Math.min(W/VW,(H-24-10)/2/VH);stack=b>a;sc=stack?b:a;}else sc=Math.min(W/VW,H/VH);
    sc=Math.max(.1,sc);
    st.style.flexDirection=stack?'column':'row';st.style.alignItems=stack?'center':'flex-start';
    ['stu','tea'].forEach(function(k){var fr=document.querySelector('.fr.'+k),on=show.indexOf(k)>=0;fr.hidden=!on;if(!on)return;
      var box=fr.querySelector('.box');box.style.width=Math.floor(VW*sc)+'px';box.style.height=Math.floor(VH*sc)+'px';fr.querySelector('iframe').style.transform='scale('+sc+')';});
    document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===view);});
  }
  function setView(v){view=v;fit();}
  window.addEventListener('resize',fit);
  document.querySelectorAll('.seg button').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v);});});
  /* 說明收起來／打開 */
  function fold(on){document.body.classList.toggle('folded',on);setTimeout(fit,0);setTimeout(fit,260);}
  document.querySelector('.fold').addEventListener('click',function(){fold(true);});
  document.querySelector('.rail .open').addEventListener('click',function(){fold(false);});
  /* 操作老師畫面 */
  function T(){try{return ft.contentDocument;}catch(e){return null;}}
  function assign(id){var d=T();var b=d&&d.querySelector('.task-btn[data-id="'+id+'"]');if(b)b.click();}
  function openSeat(n){var d=T();if(!d)return;var tl=d.querySelectorAll('.grid .tile')[n-1];if(tl){var s=tl.querySelector('.tile-stage');if(s)s.click();}}
  function closeModal(){var d=T();if(!d)return;var m=d.querySelector('.modal');if(m&&!m.hidden){var x=m.querySelector('.mclose,.close,[data-close]');if(x)x.click();else m.hidden=true;}}
  function flash(k){var b=document.querySelector('.fr.'+k+' .box');if(!b)return;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}
  /* 冰塊動畫：整個學生平板放到全螢幕 */
  function fullStu(){setView('stu');fold(true);var el=document.documentElement;try{var r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(r&&r.catch)r.catch(function(){});}catch(e){}}
  document.addEventListener('fullscreenchange',function(){setTimeout(fit,50);});
  var S=[
    {chap:'開始',title:'歡迎來到 7 個人的小教室',view:'both',
      lead:'你是 <b>1 號學生</b>，2～7 號是電腦<b>模擬的同學</b>。另一邊是<b>真正上課用的老師版</b>：每個孩子的每一個動作，都即時出現在老師的格子裡。',
      look:['📐 角度：把角描下來、疊上去比大小','🟦 面積：把半格拼成一平方公分','🍰 除法：8 ÷ 2 是平分給 2 人，還是每人 2 片？','🍕 分數：自己平分、塗色、排在一起比','🥛 容量：倒水看刻度，把 1 公升冰塊切到 1 毫升'],lookH:'這次體驗五站',
      tip:'每一站都是<span class="who s">先當學生</span> → <span class="who t">再換老師看全班</span>。上方可以切換畫面；左邊的說明按「收起」，體驗區會變大。',
      more:'<p>模擬同學各有個性：2 號小安又快又準、3 號阿哲常有迷思、4 號米米很慢、5 號小葵會卡住、6 號阿寶很粗心、7 號彤彤普通。名字都是虛構的。</p>'},
    {chap:'📐 角度',who:'s',title:'描角比大小：邊越長，角就越大嗎？',view:'stu',go:function(){assign('xa1');},
      lead:'甲的邊很長、乙的邊很短。孩子不用量角器，而是把角<b>描下來、疊上去比</b>。',
      steps:['左邊工具按<b>「描角」</b>。','依序點三下：<b>乙的頂點</b> → 一條邊上的一點 → 另一條邊上的一點。','拖著描好的角，把<b>頂點放到甲的頂點</b>上；拉 <b>↻</b> 轉一轉，讓一條邊疊在甲的邊上。','乙的另一條邊在甲的外面還是裡面？用<b>「畫筆」</b>圈出答案。'],
      more:'<p>很多孩子會說「甲比較大，因為邊比較長」。自己描、自己疊，孩子會親眼看到：角的大小跟邊的長短無關。</p>',
      acts:[['再派一次這個活動',function(){assign('xa1');setView('stu');}]]},
    {chap:'📐 角度',who:'t',title:'換老師看：每個孩子怎麼比，一目了然',view:'tea',
      lead:'<b>每一格就是一個孩子的平板</b>：他描了什麼、疊在哪裡、圈了哪個，都即時出現。',
      look:['誰真的把角<b>描下來、疊上去</b>了？','誰<b>沒有描</b>，直接用看的就圈答案？','誰<b>疊歪了</b>，還圈了「甲」？'],
      steps:['<b>點任何一格</b>，放大看那個孩子的畫面。','放大後按<b>「✋ 我來操作」</b>：直接在他的平板上示範；按「👉 換他自己做」還給他。','格子上的<b>綠燈／紅燈</b>：給孩子一個訊號。'],stepsH:'老師可以這樣做',
      acts:[['放大看 3 號阿哲',function(){setView('tea');openSeat(3);flash('tea');}],['放大看 6 號阿寶',function(){setView('tea');openSeat(6);flash('tea');}]]},
    {chap:'📐 角度',who:'s',title:'自動批改：是真的會，還是猜對的？',view:'both',go:function(){closeModal();assign('cmp');},
      lead:'「哪個角比較大」12 題，<b>系統自動對答</b>。孩子要先把乙疊到甲上、對齊，再作答。',
      steps:['拖「乙」到「甲」的頂點，按「↺ 轉／轉 ↻」讓邊對齊。','按「甲比較大／一樣大／乙比較大」，做兩三題。','看老師畫面上<b>你自己那一格（1 號）</b>。'],
      tip:'格子下面的小圓點：<b style="color:#1f9d55">綠＝對</b>、<b style="color:#c0392b">紅＝錯</b>，<b>空心＝沒對齊就作答</b>。同樣答對，空心的是猜的，紙本考卷看不出來。'},
    {chap:'🟦 面積',who:'s',title:'補成一格：兩個半格拼成一平方公分',view:'stu',go:function(){closeModal();assign('apair');},
      lead:'孩子常把半格當成一格數，或乾脆不算。這裡要<b>動手把兩個半格拼成一格</b>，再數一共幾平方公分。',
      steps:['按住一片三角形<b>拖動</b>；選到它以後可以<b>「轉 90°」「翻面」</b>。','把兩個半格拼在同一格裡（靠近會自動對齊）。','上方會顯示「拼好幾格」；都拼好了，再按數字回答。']},
    {chap:'🟦 面積',who:'t',title:'數格子：塗一塗、剪一剪，過程都看得到',view:'both',go:function(){assign('acnt');},
      lead:'孩子可以<b>一格一格塗色</b>數，也可以用<b>剪刀</b>把凸出來的部分移到缺口拼成整格。',
      look:['每一格寫著孩子<b>塗了幾格、剪了幾片</b>：誰在數、誰在猜，馬上分得出來。','有人把<b>半格當成一整格</b>數，答案就會多出來，這時候老師就該過去看看。'],
      tip:'你也可以在學生平板上做幾題：左邊按「塗格子」，在格子上點一點或拖一拖。'},
    {chap:'🍰 除法',who:'s',title:'同樣是 8 ÷ 2，意思不一樣',view:'stu',go:function(){closeModal();assign('xdv');},
      lead:'<div class="two"><div class="e"><b>第 1 題・等分除</b>8 片蛋糕<b>平分給 2 人</b>，一人幾片？</div><div class="i"><b>第 2 題・包含除</b>8 片蛋糕<b>每人 2 片</b>，可分給幾人？</div></div>',
      steps:['先<b>判斷</b>題目裡的「2」是什麼。選錯了不會給答案，而是請你再讀一次題目。','判斷對了，才能<b>自己拿盤子分</b>：要幾個盤子、每盤幾片，都自己決定。','寫算式、選單位。<b>圖和算式都對才算對</b>；錯了會自動多一題同類型的。']},
    {chap:'🍰 除法',who:'t',title:'老師看到的是「想法」，不只是答案',view:'tea',
      lead:'格子會顯示孩子<b>正在判斷題意</b>、<b>選錯幾次</b>，也看得到他的盤子怎麼分。',
      look:['誰把「平分給 2 人」和「每人 2 片」搞混了？（格子上寫「選錯 1 次」）','誰判斷對了，但盤子分錯了？','誰一直停在同一題沒動？（5 號小葵會卡住）'],
      steps:['上方按<b>「全班看老師」</b>：所有平板停住、顯示「請看老師」。再按一次解除。','點一格放大 → <b>「✋ 我來操作」</b>，在孩子的盤子上示範。'],stepsH:'試試看老師的按鈕',
      acts:[['放大看 5 號小葵',function(){setView('tea');openSeat(5);flash('tea');}],['放大看 3 號阿哲',function(){setView('tea');openSeat(3);flash('tea');}]]},
    {chap:'🍕 分數',who:'s',title:'分數板：自己平分、自己塗，排在一起比',view:'stu',go:function(){closeModal();assign('fr2');},
      lead:'孩子常以為 1/5 比 1/3 大，因為「5 比 3 大」。每一條都是「1 整條」，<b>自己平分、自己塗</b>，上下對齊一看就知道。',
      steps:['甲、乙各按 <b>「＋」</b>，平分成題目說的塊數。','<b>點一塊就塗色</b>，塗出題目的分數；再點一次可以擦掉。','比比看誰塗的比較長，按「甲 比較多／一樣多／乙 比較多」。'],
      more:'<p>參考國外很受歡迎的 Polypad 分數條。另外兩個活動：「幾分之幾」（也有蛋糕、披薩的圓形）和「合起來、吃掉」（同分母加減）。圖和分數都要對才算對。</p>',
      acts:[['換成「幾分之幾」',function(){assign('fr1');setView('stu');}],['換成「合起來、吃掉」',function(){assign('fr3');setView('stu');}]]},
    {chap:'🍕 分數',who:'t',title:'圖是對的，答案卻錯了',view:'tea',
      lead:'老師的格子會畫出每個孩子的分數板：切成幾塊、塗了幾塊、寫了什麼。',

  var cur=0,seen={};
  var steps=document.querySelector('.steps'),card=document.querySelector('.card');
  S.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.textContent=(i+1)+' '+s.chap;b.title=s.title;b.addEventListener('click',function(){go(i);});steps.appendChild(b);});
  function list(items,tag){return '<'+tag+'>'+items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+tag+'>';}
  function go(i){
    cur=Math.max(0,Math.min(S.length-1,i));var s=S[cur];seen[cur]=1;
    document.querySelector('.ghead .chap').textContent=s.chap;
    document.querySelector('.ghead .cnt').textContent=(cur+1)+' / '+S.length;
    document.querySelector('.rail .rn').innerHTML=(cur+1)+'<br>/'+S.length;
    var h=(s.who?'<span class="who '+s.who+'">'+(s.who==='s'?'🧒 你是學生':'👩‍🏫 你是老師')+'</span>':'')+'<h2>'+s.title+'</h2>';
    if(s.lead)h+='<div class="lead">'+s.lead+'</div>';
    if(s.steps&&s.who!=='t'&&!s.stepsH)h+='<div class="do"><b class="h">👉 做做看</b>'+list(s.steps,'ol')+'</div>';
    if(s.look)h+='<div class="do look"><b class="h">'+(s.lookH||'🔍 找找看')+'</b>'+list(s.look,'ul')+'</div>';
    if(s.steps&&(s.who==='t'||s.stepsH))h+='<div class="do"><b class="h">'+(s.stepsH||'👉 做做看')+'</b>'+list(s.steps,s.stepsH&&s.stepsH.charAt(0)==='✋'?'ul':'ol')+'</div>';
    if(s.tip)h+='<div class="tip">'+s.tip+'</div>';
    if(s.acts)h+='<div class="acts"></div>';
    if(s.more)h+='<details class="more"><summary>為什麼這樣設計？</summary>'+s.more+'</details>';
    card.innerHTML=h;
    if(s.acts){var a=card.querySelector('.acts');s.acts.forEach(function(x){var b=document.createElement('button');b.type='button';b.className='act';b.textContent=x[0];b.addEventListener('click',x[1]);a.appendChild(b);});}
    card.scrollTop=0;
    if(s.view)setView(s.view);
    if(s.go)s.go();
    steps.querySelectorAll('button').forEach(function(b,k){b.classList.toggle('on',k===cur);b.classList.toggle('done',!!seen[k]&&k!==cur);if(k===cur&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'center'});});
    var last=cur===S.length-1;
    ['.pv','.rail .rpv'].forEach(function(q){document.querySelector(q).disabled=cur===0;});
    ['.nx','.rail .rnx'].forEach(function(q){document.querySelector(q).disabled=last;});
    document.querySelector('.nx').textContent=last?'體驗完成 🎉':'下一步 ▶';
  }
  document.querySelector('.pv').addEventListener('click',function(){go(cur-1);});
  document.querySelector('.nx').addEventListener('click',function(){go(cur+1);});
  document.querySelector('.rail .rpv').addEventListener('click',function(){go(cur-1);});
  document.querySelector('.rail .rnx').addEventListener('click',function(){go(cur+1);});
  /* 老師畫面準備好才開始 */
  function ready(){var d=T();return d&&d.querySelector('.task-btn[data-id="xa1"]');}
  (function wait(){if(ready())go(0);else setTimeout(wait,200);})();
  fit();
})();
</script>
