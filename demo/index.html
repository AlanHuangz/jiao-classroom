<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>線上教室 體驗館</title>
<style>
:root{--bg:#eef3f6;--paper:#fff;--ink:#1d2b36;--muted:#61727f;--line:#d5dee5;--brand:#2a6fb0;--brand2:#e8930c;--ok:#1f9d55;--f:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:20px;margin:0 10px 0 0;white-space:nowrap}
header h1 small{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.vbtn{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--line);background:#f7fafc;color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.vbtn.on{background:var(--brand);border-color:var(--brand);color:#fff}
header .sp{flex:1}
header a.how{font-weight:800;color:#a35f00;text-decoration:none;border:2px solid #f0c06a;background:#fff7e6;border-radius:999px;padding:6px 14px}
main{flex:1;display:flex;min-height:0}
.guide{width:360px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.toc{display:flex;gap:4px;padding:10px 12px 0;flex-wrap:wrap}
.toc button{font:inherit;font-size:13px;border:none;background:#eef2f5;color:var(--muted);border-radius:8px;padding:4px 8px;cursor:pointer}
.toc button.on{background:#fff3d6;color:var(--ink);font-weight:800;box-shadow:0 0 0 2px #f5b83d inset}
.toc button.done{color:var(--ok)}
.card{flex:1;overflow:auto;padding:12px 16px 16px}
.card .chap{font-size:13px;font-weight:800;color:var(--brand2);letter-spacing:1px}
.card h2{font-size:21px;margin:4px 0 10px;line-height:1.35}
.card p{line-height:1.65;margin:0 0 10px;font-size:15.5px}
.card .who{display:inline-block;font-size:12.5px;font-weight:800;border-radius:6px;padding:1px 8px;margin-bottom:6px}
.who.s{background:#e3f1ff;color:#1d5c99}.who.t{background:#e9f8ef;color:#17703c}.who.a{background:#f3ecff;color:#6a3fb5}
.do{background:#f6f9fb;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.do b.h{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.do ol,.do ul{margin:0;padding-left:20px}.do li{margin:5px 0;line-height:1.55;font-size:15px}
.note{background:#fff8e6;border-left:4px solid #f0b43c;border-radius:6px;padding:8px 10px;font-size:14.5px;line-height:1.6;margin:10px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.two div{border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.5}
.two .e{background:#e9f8ef}.two .i{background:#e3f1ff}
.two b{display:block;font-size:15px;margin-bottom:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.act{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--brand);color:var(--brand);background:#fff;border-radius:10px;padding:6px 12px;cursor:pointer}
.act:hover{background:#eaf3fb}
.nav{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#fafcfd}
.nav button{font:inherit;font-size:16px;font-weight:800;border-radius:12px;padding:9px 14px;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink)}
.nav .nx{flex:1;background:var(--brand2);border-color:var(--brand2);color:#fff}
.nav .nx:disabled{opacity:.45;cursor:default}
.stage{flex:1;position:relative;min-width:0;display:flex;gap:12px;padding:12px;align-items:flex-start;justify-content:center}
.fr{position:relative;flex:none;display:flex;flex-direction:column;gap:6px}
.fr[hidden]{display:none}
.fr .lab{font-size:14px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.fr .lab i{font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
.fr.stu .lab i{background:#e3f1ff;color:#1d5c99}.fr.tea .lab i{background:#e9f8ef;color:#17703c}
.box{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 2px 10px rgba(20,40,60,.18);background:#fff}
.box iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0}
.flash{animation:fl 1.2s 2}@keyframes fl{50%{box-shadow:0 0 0 6px rgba(232,147,12,.7)}}
.bots{position:absolute;left:-3000px;top:0;width:1200px;height:700px;border:0}
.small-warn{display:none;padding:8px 14px;background:#fff3d6;font-size:14px}
@media (max-width:900px){.small-warn{display:block}.guide{width:300px}}
@media (max-width:700px){header h1 small{display:none}main{flex-direction:column}.guide{width:auto;max-height:46vh;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>線上教室 體驗館<small>20 分鐘，當一次學生、也當一次老師</small></h1>
  <button class="vbtn" data-v="stu" type="button">🧒 學生平板（1 號）</button>
  <button class="vbtn" data-v="tea" type="button">👩‍🏫 老師畫面</button>
  <button class="vbtn" data-v="both" type="button">⬌ 並排</button>
  <span class="sp"></span>
  <a class="how" href="agent.html" target="_blank" rel="noopener">🤖 這是怎麼做出來的？</a>
</header>
<div class="small-warn">畫面比較小，建議用電腦或大螢幕平板體驗（手機也能看，但會很小）。</div>
<main>
  <aside class="guide">
    <div class="toc"></div>
    <div class="card"></div>
    <div class="nav"><button class="pv" type="button">◀ 上一步</button><button class="nx" type="button">下一步 ▶</button></div>
  </aside>
  <section class="stage">
    <div class="fr stu"><div class="lab">🧒 學生平板 <i>你是 1 號</i></div><div class="box"><iframe title="學生平板" id="fs"></iframe></div></div>
    <div class="fr tea"><div class="lab">👩‍🏫 老師畫面 <i>全班 7 人，即時更新</i></div><div class="box"><iframe title="老師畫面" id="ft"></iframe></div></div>
  </section>
</main>
<iframe class="bots" id="fb" title="模擬同學" aria-hidden="true" tabindex="-1"></iframe>
<script>
(function(){
  /* 每次打開都是一間新的教室 */
  try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf('xp:')===0)localStorage.removeItem(k);}}catch(e){}
  var room=Math.random().toString(36).slice(2,10);
  var ft=document.getElementById('ft'),fs=document.getElementById('fs'),fb=document.getElementById('fb');
  ft.src='app.html?role=teacher&room='+room;
  setTimeout(function(){fb.src='app.html?role=bots&room='+room;fs.src='app.html?role=student&room='+room+'#2468-1';},700);
  var VW=1280,VH=800,view='stu';
  function fit(){
    var st=document.querySelector('.stage'),W=st.clientWidth-24,H=st.clientHeight-24-26;
    var show=view==='both'?['stu','tea']:[view],sc,stack=false;
    if(view==='both'){var a=Math.min((W-12)/2/VW,H/VH),b=Math.min(W/VW,(H+26-2*36-14)/2/VH);stack=b>a||window.innerWidth<700;sc=stack?b:a;}else sc=Math.min(W/VW,H/VH);
    st.style.flexDirection=stack?'column':'row';st.style.alignItems=stack?'center':'flex-start';
    ['stu','tea'].forEach(function(k){var fr=document.querySelector('.fr.'+k),on=show.indexOf(k)>=0;fr.hidden=!on;if(!on)return;
      var box=fr.querySelector('.box');box.style.width=Math.floor(VW*sc)+'px';box.style.height=Math.floor(VH*sc)+'px';fr.querySelector('iframe').style.transform='scale('+sc+')';});
    document.querySelectorAll('.vbtn').forEach(function(b){b.classList.toggle('on',b.dataset.v===view);});
  }
  function setView(v){view=v;fit();}
  window.addEventListener('resize',fit);
  document.querySelectorAll('.vbtn').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.v);});});
  /* 操作老師畫面 */
  function T(){try{return ft.contentDocument;}catch(e){return null;}}
  function assign(id){var d=T();var b=d&&d.querySelector('.task-btn[data-id="'+id+'"]');if(b)b.click();}
  function openSeat(n){var d=T();if(!d)return;var mc=d.querySelector('.modal .mx, .modal .close');var tl=d.querySelectorAll('.grid .tile')[n-1];if(tl){var s=tl.querySelector('.tile-stage');if(s)s.click();}}
  function closeModal(){var d=T();if(!d)return;var m=d.querySelector('.modal');if(m&&!m.hidden){var x=m.querySelector('.mclose,.close,[data-close]');if(x)x.click();else m.hidden=true;}}
  function flash(k){var b=document.querySelector('.fr.'+k+' .box');if(!b)return;b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash');}
  var S=[
    {chap:'開始',title:'歡迎來到 7 個人的小教室',view:'both',html:
      '<p>這是一間 <b>7 個人的小班</b>。你是 <b>1 號學生</b>，2～7 號是電腦<b>模擬的同學</b>：有人很快、有人常常錯、有人會卡住，就像真的教室。</p>'+
      '<p>右邊的老師畫面，是<b>真正上課用的老師版</b>。每個孩子在平板上的每一個動作，都會即時出現在老師的格子裡。</p>'+
      '<div class="do"><b class="h">這次體驗四站</b><ul><li>📐 角度：把角描下來、疊上去比大小</li><li>🟦 面積：把半格拼成一平方公分，再數一數</li><li>🍰 除法：「8 ÷ 2」是平分給 2 人，還是每人 2 片？</li><li>🍕 分數：自己平分、塗色，把兩條分數條排在一起比大小</li></ul></div>'+
      '<p>每一站都是：<span class="who s">先當學生</span> → <span class="who t">再換老師看全班</span>。左邊這個框會一步一步帶你做。</p>'+
      '<div class="note">上方三個按鈕可以隨時切換：只看學生平板、只看老師畫面、或兩個並排。</div>'},
    {chap:'📐 角度',who:'s',title:'描角比大小：邊長越長，角就越大嗎？',view:'stu',go:function(){assign('xa1');},html:
      '<p>甲的邊很長，乙的邊很短。很多孩子會說「甲比較大，因為邊比較長」。</p><p>在這裡，孩子不用量角器，而是自己把角<b>「複製」下來，疊上去比</b>。</p>'+
      '<div class="do"><b class="h">做做看（在學生平板上）</b><ol><li>左邊工具按<b>「描角」</b>。</li><li>依序點三下：<b>乙的頂點</b> → 乙<b>一條邊</b>上的一點 → <b>另一條邊</b>上的一點。乙就被描成一張彩色的「描圖紙」。</li><li>拖著描好的角，把<b>頂點放到甲的頂點</b>上；拉旁邊的 <b>↻</b> 轉一轉，讓一條邊和甲的邊疊在一起（靠近會自動吸過去）。</li><li>乙的另一條邊在甲的外面還是裡面？用<b>「畫筆」</b>圈出答案。</li></ol></div>',
      acts:[['再派一次這個活動',function(){assign('xa1');setView('stu');}]]},
    {chap:'📐 角度',who:'t',title:'換老師看：每個孩子怎麼比，一目了然',view:'tea',html:
      '<p>這是老師的畫面。<b>每一格就是一個孩子的平板</b>，他描了什麼、疊在哪、圈了哪個，都即時出現。</p>'+
      '<div class="do"><b class="h">找找看</b><ul><li>誰真的把角<b>描下來、疊上去</b>了？</li><li>誰<b>沒有描</b>，直接用看的就圈答案？</li><li>誰<b>疊歪了</b>，還圈了「甲」？（這就是「邊長越長角越大」的迷思）</li></ul></div>'+
      '<div class="do"><b class="h">老師可以這樣做</b><ol><li><b>點任何一格</b>，放大看他的畫面。</li><li>放大後按<b>「✋ 我來操作」</b>：你就能直接在那個孩子的平板上示範，他的畫面會鎖住、跟著你動。按「👉 換他自己做」還給他。</li><li>格子上的<b>綠燈／紅燈</b>：給孩子一個訊號（例如紅燈＝老師待會過去）。</li></ol></div>',
      acts:[['放大看 3 號阿哲',function(){setView('tea');openSeat(3);flash('tea');}],['放大看 6 號阿寶',function(){setView('tea');openSeat(6);flash('tea');}]]},
    {chap:'📐 角度',who:'s',title:'自動批改：是真的會，還是猜對的？',view:'both',go:function(){closeModal();assign('cmp');},html:
      '<p>第二個活動「哪個角比較大」一共 12 題，<b>系統自動對答</b>。孩子要把「乙」拖到「甲」上、轉到邊對齊，再按答案。</p>'+
      '<div class="do"><b class="h">做做看</b><ol><li>在學生平板上，拖「乙」到「甲」的頂點，按「↺ 轉／轉 ↻」或拉把手讓邊對齊。</li><li>按「甲比較大／一樣大／乙比較大」。做兩三題就好。</li><li>看右邊老師畫面上<b>你自己的那一格（1 號）</b>。</li></ol></div>'+
      '<div class="note">老師格子下面的小圓點：<b style="color:#1f9d55">綠＝答對</b>、<b style="color:#c0392b">紅＝答錯</b>；<b>空心＝沒有先對齊就作答</b>。同樣是答對，實心是真的比過、空心是猜的——紙本考卷看不出來，這裡一眼就知道。</div>'},
    {chap:'🟦 面積',who:'s',title:'補成一格：把兩個半格拼成一平方公分',view:'stu',go:function(){closeModal();assign('apair');},html:
      '<p>面積單元最難的是「<b>半格</b>」。孩子常常把半格當成一格數，或乾脆不算。</p>'+
      '<p>這裡的半格三角形已經切好，孩子要<b>動手把兩個半格拼成完整的一平方公分</b>，再數一共幾平方公分。</p>'+
      '<div class="do"><b class="h">做做看</b><ol><li>按住一片三角形<b>拖動</b>；選到它之後可以按<b>「轉 90°」「翻面」</b>。</li><li>把兩個半格拼在同一格裡，變成完整的一格（靠近會自動對齊）。</li><li>上方會顯示「拼好幾格」；都拼好了，再按數字回答一共幾平方公分。</li></ol></div>'},
    {chap:'🟦 面積',who:'t',title:'數格子：塗一塗、剪一剪，過程都看得到',view:'both',go:function(){assign('acnt');},html:
      '<p>第二個活動「數格子算面積」，孩子可以<b>一格一格塗色</b>數，也可以用<b>剪刀</b>把凸出來的部分剪下來，移到缺口拼成整格。</p>'+
      '<div class="do"><b class="h">看老師畫面</b><ul><li>每一格上面寫著孩子<b>塗了幾格、剪了幾片</b>：誰在認真數、誰沒數就直接猜，馬上分得出來。</li><li>有同學把<b>半格當成一整格</b>數，答案就會多出來——這正是老師要走過去的時候。</li></ul></div>'+
      '<div class="note">你也可以在學生平板上做幾題：左邊按「塗格子」在格子上點一點或拖一拖。</div>'},
    {chap:'🍰 除法',who:'s',title:'同樣是 8 ÷ 2，意思不一樣',view:'stu',go:function(){closeModal();assign('xdv');},html:
      '<p>算式一模一樣，孩子卻常常分不清題目在說哪一種：</p>'+
      '<div class="two"><div class="e"><b>第 1 題・等分除</b>8 片蛋糕，<b>平分給 2 個人</b>，一個人幾片？<br>→「2」是<b>分成 2 份</b></div><div class="i"><b>第 2 題・包含除</b>8 片蛋糕，<b>每人 2 片</b>，可以分給幾人？<br>→「2」是<b>每份 2 片</b></div></div>'+
      '<div class="do"><b class="h">做做看（兩題都做）</b><ol><li>先<b>判斷</b>：題目裡的「2」是什麼？選錯了系統不會直接給答案，而是請你再讀一次題目。</li><li>判斷對了，才能<b>自己拿盤子分</b>：要幾個盤子、每盤放幾片，都是自己決定，系統不幫你擺好。</li><li>最後寫算式、選單位。<b>圖和算式都對才算對</b>；錯了，後面會自動多加一題同類型的。</li></ol></div>'},
    {chap:'🍰 除法',who:'t',title:'老師看到的是「想法」，不只是答案',view:'tea',html:
      '<p>老師格子會顯示孩子<b>正在判斷題意</b>、<b>選錯了幾次</b>，也看得到他的盤子是怎麼分的。</p>'+
      '<div class="do"><b class="h">找找看</b><ul><li>誰把「平分給 2 人」和「每人 2 片」搞混了？（格子上會寫「判斷題意中・選錯 1 次」）</li><li>誰判斷對了，但盤子分錯了？</li><li>誰一直停在同一題沒有動？（5 號小葵會卡住——在真的教室裡，這種孩子最容易被忽略）</li></ul></div>'+
      '<div class="do"><b class="h">試試看老師的按鈕</b><ul><li>上方按<b>「全班看老師」</b>：所有孩子的平板會停住、顯示「請看老師」，模擬同學也會停下來。再按一次解除。</li><li>點一格放大 → 按<b>「✋ 我來操作」</b>，直接在孩子的盤子上示範怎麼分。</li></ul></div>',
      acts:[['放大看 5 號小葵',function(){setView('tea');openSeat(5);flash('tea');}],['放大看 3 號阿哲',function(){setView('tea');openSeat(3);flash('tea');}]]},
    {chap:'🍕 分數',who:'s',title:'分數板：自己平分、自己塗，排在一起比',view:'stu',go:function(){closeModal();assign('fr2');},html:
      '<p>分數最難的是「<b>平分</b>」和「<b>比大小</b>」。孩子常以為 1/5 比 1/3 大，因為「5 比 3 大」。</p>'+
      '<p>這個分數板參考了國外很受歡迎的 Polypad 分數條：每一條都是「1 整條」，孩子<b>自己決定平分成幾塊、自己塗</b>，兩條上下對齊，誰長誰短一看就知道。</p>'+
      '<div class="do"><b class="h">做做看（在學生平板上）</b><ol><li>甲、乙各按 <b>「＋」</b>，平分成題目說的塊數（每一塊都一樣大，上面會寫 1/幾）。</li><li><b>點一塊就塗色</b>，塗出題目的分數；再點一次可以擦掉。</li><li>看看兩條塗色的部分誰比較長，按「甲 比較多／一樣多／乙 比較多」。</li></ol></div>'+
      '<div class="note">另外兩個活動：<b>「幾分之幾」</b>（平分、塗色、寫分數，也有蛋糕、披薩的圓形）和<b>「合起來、吃掉」</b>（同分母加減，用兩種顏色＋「吃掉」）。圖和寫的分數都要對才算對。</div>',
      acts:[['換成「幾分之幾」',function(){assign('fr1');setView('stu');}],['換成「合起來、吃掉」',function(){assign('fr3');setView('stu');}]]},
    {chap:'🍕 分數',who:'t',title:'圖是對的，答案卻錯了——老師一眼就看到',view:'tea',html:
